<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="가족 일정">
<title>가족 일정</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3b82f6">
<meta name="mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#faf8f5;--card:#fff;--border:#ede8e0;--text:#2d2520;--muted:#9e9488;
  --shadow:0 2px 16px rgba(0,0,0,0.07);--radius:14px;
  --c영대:#3b82f6;--l영대:#eff6ff;
  --c현희:#f472b6;--l현희:#fdf2f8;
  --c제하:#34d399;--l제하:#ecfdf5;
  --c가율:#fb923c;--l가율:#fff7ed;
  --c가은:#a78bfa;--l가은:#f5f3ff;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
.app-header{background:var(--card);border-bottom:1px solid var(--border);padding:9px 12px;position:sticky;top:0;z-index:100;box-shadow:var(--shadow);}
.header-row{display:flex;align-items:center;gap:5px;}
.app-title{font-size:16px;font-weight:900;letter-spacing:-0.5px;white-space:nowrap;}
.app-version{font-size:9px;color:var(--muted);font-weight:600;background:var(--bg);border-radius:4px;padding:1px 4px;flex-shrink:0;}
.header-actions{display:flex;gap:5px;align-items:center;margin-left:auto;}
.hdr-btn{height:30px;border:1.5px solid var(--border);border-radius:8px;padding:0 9px;font-size:11px;font-weight:700;font-family:inherit;cursor:pointer;display:flex;align-items:center;gap:3px;white-space:nowrap;flex-shrink:0;background:var(--bg);}
.btn-loc{background:#ede9fe;color:#7c3aed;border-color:#ede9fe;}
.btn-add-main{background:var(--c영대);color:white;border-color:var(--c영대);}
.btn-refresh{color:var(--muted);}
.tab-nav{display:flex;background:var(--card);border-bottom:1px solid var(--border);}
.tab-btn{flex:1;padding:10px 2px;border:none;background:transparent;font-family:inherit;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;transition:all 0.2s;white-space:nowrap;}
.tab-btn.on{color:var(--c영대);border-bottom-color:var(--c영대);}
.family-filter-wrap{background:var(--card);padding:7px 12px 6px;border-bottom:1px solid var(--border);}
.family-filter{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;}
.family-filter::-webkit-scrollbar{display:none;}
.f-btn{border:2px solid transparent;border-radius:8px;padding:4px 9px;font-size:11px;font-weight:700;font-family:inherit;cursor:pointer;white-space:nowrap;transition:all 0.2s;opacity:0.4;flex-shrink:0;}
.f-btn.all{border-color:#ccc;background:var(--bg);color:var(--muted);}
.f-btn.all.on{opacity:1;background:var(--text);color:#fff;border-color:var(--text);}
.f-btn[data-f="유영대"]{background:var(--l영대);color:var(--c영대);border-color:var(--c영대);}
.f-btn[data-f="이현희"]{background:var(--l현희);color:var(--c현희);border-color:var(--c현희);}
.f-btn[data-f="유제하"]{background:var(--l제하);color:var(--c제하);border-color:var(--c제하);}
.f-btn[data-f="유가율"]{background:var(--l가율);color:var(--c가율);border-color:var(--c가율);}
.f-btn[data-f="유가은"]{background:var(--l가은);color:var(--c가은);border-color:var(--c가은);}
.f-btn[data-f].on,.f-btn.all.on{opacity:1;box-shadow:0 2px 6px rgba(0,0,0,0.12);}
.f-btn.all:not(.on){opacity:0.4;}
.main{padding:12px 14px;max-width:760px;margin:0 auto;}
.today-box{background:var(--card);border-radius:var(--radius);padding:11px 13px;margin-bottom:12px;box-shadow:var(--shadow);border-left:4px solid var(--c영대);}
.today-hd{display:flex;align-items:center;gap:7px;margin-bottom:7px;font-size:13px;font-weight:800;}
.today-badge{background:var(--c영대);color:#fff;border-radius:20px;padding:2px 9px;font-size:11px;font-weight:700;}
.today-empty{color:var(--muted);font-size:12px;text-align:center;padding:7px 0;}
.month-nav{display:flex;align-items:center;justify-content:center;gap:18px;margin-bottom:12px;}
.mnav-btn{background:var(--card);border:1.5px solid var(--border);border-radius:50%;width:32px;height:32px;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);}
.month-lbl{font-size:19px;font-weight:900;letter-spacing:-0.5px;}
.cal-grid{background:var(--card);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);}
.cal-wdays{display:grid;grid-template-columns:repeat(7,1fr);background:#f5f2ed;}
.cal-wd{text-align:center;padding:7px 0;font-size:12px;font-weight:700;color:var(--muted);}
.cal-wd:first-child{color:#f87171;}.cal-wd:last-child{color:#60a5fa;}
.cal-days{display:grid;grid-template-columns:repeat(7,1fr);}
.cal-day{min-height:72px;border-top:1px solid var(--border);border-right:1px solid var(--border);padding:4px 2px 2px;cursor:pointer;transition:background 0.15s;user-select:none;position:relative;overflow:hidden;}
.cal-day:nth-child(7n){border-right:none;}
.cal-day.other{opacity:0.4;pointer-events:none;}
.cal-day.today .dnum{background:var(--c영대);color:#fff;border-radius:50%;}
.cal-day.sun .dnum{color:#f87171;}.cal-day.sat .dnum{color:#60a5fa;}
.cal-day.today.sun .dnum,.cal-day.today.sat .dnum{color:#fff;}
.cal-day.holiday-day{background:#fff8f8;}
.cal-day.paste-selected{background:#dbeafe;outline:2px solid var(--c영대);}
.dnum{font-size:12px;font-weight:700;width:22px;height:22px;display:flex;align-items:center;justify-content:center;margin:0 auto 1px;}
.holiday-name{font-size:8.5px;color:#ef4444;font-weight:700;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:1px;line-height:1.3;padding:0 1px;}
.day-evs{display:flex;flex-direction:column;gap:1px;}
.d-chip{border-radius:3px;padding:1px 3px;font-size:9.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.4;}
.d-more{font-size:9px;color:var(--muted);padding-left:2px;}
.paste-banner{position:fixed;top:0;left:0;right:0;background:var(--c영대);color:#fff;padding:10px 14px;z-index:500;display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:700;transform:translateY(-100%);transition:transform 0.3s;}
.paste-banner.show{transform:translateY(0);}
.paste-banner-btns{display:flex;gap:8px;}
.paste-done{background:#fff;color:var(--c영대);border:none;border-radius:8px;padding:5px 14px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;}
.paste-cancel-btn{background:rgba(255,255,255,0.2);border:none;color:#fff;border-radius:8px;padding:5px 12px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;}
.ev-card{background:var(--card);border-radius:11px;padding:10px 12px;box-shadow:var(--shadow);border-left:4px solid var(--border);cursor:pointer;transition:all 0.2s;display:flex;align-items:flex-start;gap:8px;margin-bottom:6px;user-select:none;}
.ev-dot{width:8px;height:8px;border-radius:50%;margin-top:4px;flex-shrink:0;}
.ev-info{flex:1;min-width:0;}
.ev-title{font-size:13px;font-weight:700;margin-bottom:3px;}
.ev-meta{display:flex;flex-wrap:wrap;gap:4px;align-items:center;}
.ev-time{font-size:11px;color:var(--muted);}
.who-tag{font-size:10px;font-weight:700;border-radius:6px;padding:1px 7px;}
.ev-body{font-size:11px;color:var(--muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.ev-date-lbl{font-size:11px;color:var(--muted);margin-top:2px;font-weight:600;}
.ev-photo{width:52px;height:52px;border-radius:8px;object-fit:cover;flex-shrink:0;cursor:pointer;border:2px solid var(--border);}
.date-lbl{font-size:11px;font-weight:700;color:var(--muted);margin:12px 0 5px 2px;}
/* 검색 */
.search-area{display:flex;flex-direction:column;gap:10px;}
.search-filter{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;flex-wrap:nowrap;}
.search-filter::-webkit-scrollbar{display:none;}
.sf-btn{border:2px solid transparent;border-radius:8px;padding:4px 9px;font-size:11px;font-weight:700;font-family:inherit;cursor:pointer;white-space:nowrap;transition:all 0.2s;opacity:0.4;flex-shrink:0;}
.sf-btn.all{border-color:#ccc;background:var(--bg);color:var(--muted);}
.sf-btn.all.on{opacity:1;background:var(--text);color:#fff;border-color:var(--text);}
.sf-btn[data-sf="유영대"]{background:var(--l영대);color:var(--c영대);border-color:var(--c영대);}
.sf-btn[data-sf="이현희"]{background:var(--l현희);color:var(--c현희);border-color:var(--c현희);}
.sf-btn[data-sf="유제하"]{background:var(--l제하);color:var(--c제하);border-color:var(--c제하);}
.sf-btn[data-sf="유가율"]{background:var(--l가율);color:var(--c가율);border-color:var(--c가율);}
.sf-btn[data-sf="유가은"]{background:var(--l가은);color:var(--c가은);border-color:var(--c가은);}
.sf-btn[data-sf].on,.sf-btn.all.on{opacity:1;box-shadow:0 2px 6px rgba(0,0,0,0.12);}
.sf-btn.all:not(.on){opacity:0.4;}
.search-sort{display:flex;gap:5px;align-items:center;flex-wrap:nowrap;}
.sort-btn{border:1.5px solid var(--border);border-radius:7px;padding:3px 9px;font-size:11px;font-weight:700;font-family:inherit;cursor:pointer;background:var(--bg);color:var(--muted);white-space:nowrap;}
.sort-btn.on{background:var(--text);color:#fff;border-color:var(--text);}
.search-input{width:100%;border:1.5px solid var(--border);border-radius:12px;padding:10px 14px;font-size:13px;font-family:inherit;background:var(--card);outline:none;box-shadow:var(--shadow);}
.search-input:focus{border-color:var(--c영대);}
.search-empty{text-align:center;padding:28px;color:var(--muted);font-size:13px;}
/* 사진 탭 */
.photo-header{background:var(--card);border-radius:var(--radius);padding:14px;margin-bottom:12px;box-shadow:var(--shadow);}
.storage-bar-wrap{background:var(--border);border-radius:10px;height:8px;margin:8px 0;}
.storage-bar{background:var(--c영대);border-radius:10px;height:8px;transition:width 0.5s;}
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;}
.photo-grid-item{aspect-ratio:1;overflow:hidden;position:relative;cursor:pointer;}
.photo-grid-item img{width:100%;height:100%;object-fit:cover;}
.photo-grid-date{grid-column:1/-1;font-size:12px;font-weight:700;color:var(--muted);padding:12px 4px 4px;}
.photo-add-btn{width:52px;height:52px;border:2px dashed var(--border);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;color:var(--muted);flex-shrink:0;background:var(--bg);}
/* 사진 뷰어 */
.photo-viewer-overlay{position:fixed;inset:0;background:#000;z-index:700;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity 0.2s;}
.photo-viewer-overlay.open{opacity:1;pointer-events:all;}
.photo-viewer-wrap{width:100%;height:100%;overflow:hidden;position:relative;touch-action:none;}
.photo-viewer-img{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);max-width:100%;max-height:100%;object-fit:contain;will-change:transform;}
.photo-viewer-close{position:absolute;top:16px;right:16px;background:rgba(0,0,0,0.6);color:#fff;border:none;border-radius:50%;width:40px;height:40px;font-size:18px;cursor:pointer;z-index:10;display:flex;align-items:center;justify-content:center;}
.photo-viewer-del{position:absolute;bottom:40px;right:16px;background:#ef4444;color:#fff;border:none;border-radius:20px;padding:10px 20px;font-size:13px;font-weight:700;cursor:pointer;z-index:10;}
.photo-viewer-nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,0.55);color:#fff;border:none;border-radius:50%;width:42px;height:42px;font-size:18px;cursor:pointer;z-index:10;display:none;align-items:center;justify-content:center;}
.photo-viewer-nav.show{display:flex;}
.photo-viewer-prev{left:12px;}
.photo-viewer-next{right:12px;}
.photo-viewer-count{position:absolute;bottom:48px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.6);color:#fff;border-radius:14px;padding:5px 14px;font-size:12px;font-weight:700;z-index:10;display:none;}
.photo-viewer-count.show{display:block;}
/* 일정 카드 썸네일 (여러 장일 때 개수 표시) */
.ev-photo-wrap{position:relative;flex-shrink:0;}
.ev-photo-more{position:absolute;right:-3px;bottom:-3px;background:var(--c영대);color:#fff;border-radius:10px;padding:1px 6px;font-size:9.5px;font-weight:800;border:1.5px solid #fff;pointer-events:none;}
/* 수정 모달 사진 목록 */
.edit-photo-item{position:relative;width:80px;height:80px;flex-shrink:0;}
.edit-photo-item img{width:100%;height:100%;border-radius:8px;object-fit:cover;border:2px solid var(--border);}
.edit-photo-x{position:absolute;top:-6px;right:-6px;background:#ef4444;color:#fff;border:2px solid #fff;border-radius:50%;width:22px;height:22px;font-size:12px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;font-family:inherit;line-height:1;}
.edit-photo-new{position:absolute;bottom:3px;left:3px;background:var(--c제하);color:#fff;border-radius:6px;padding:1px 5px;font-size:9px;font-weight:800;pointer-events:none;}
.photo-hint{font-size:10px;color:var(--muted);margin-top:6px;}
/* 상세 모달 사진 여러 장 */
.det-photos{display:flex;flex-direction:column;gap:6px;margin-top:4px;}
.det-photos img{width:100%;border-radius:10px;cursor:pointer;display:block;}
/* 모달 */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:400;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity 0.25s;}
.modal-overlay.open{opacity:1;pointer-events:all;}
.modal-sheet{background:var(--card);border-radius:22px 22px 0 0;width:100%;max-width:600px;max-height:92vh;overflow-y:auto;padding:16px 16px 44px;transform:translateY(100%);transition:transform 0.32s cubic-bezier(0.34,1.2,0.64,1);}
.modal-overlay.open .modal-sheet{transform:translateY(0);}
.modal-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 16px;}
.modal-title{font-size:17px;font-weight:900;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;}
.modal-close{background:var(--bg);border:none;border-radius:50%;width:28px;height:28px;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--muted);}
.modal-overlay.confirm-layer{z-index:600;align-items:center;}
.confirm-modal{background:var(--card);border-radius:18px;width:calc(100% - 40px);max-width:340px;padding:22px 20px;transform:scale(0.9);transition:transform 0.25s;}
.modal-overlay.confirm-layer.open .confirm-modal{transform:scale(1);}
.confirm-title{font-size:16px;font-weight:900;margin-bottom:8px;}
.confirm-desc{font-size:13px;color:var(--muted);margin-bottom:16px;line-height:1.6;}
.confirm-ev-preview{background:var(--bg);border-radius:10px;padding:10px 12px;margin-bottom:18px;border-left:4px solid var(--c영대);}
.confirm-btns{display:flex;gap:8px;}
.confirm-btn{flex:1;padding:12px;border:none;border-radius:11px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;}
.confirm-ok{background:var(--c영대);color:#fff;}
.confirm-cancel{background:var(--bg);color:var(--text);}
.paste-opt-btns{display:flex;flex-direction:column;gap:10px;margin-top:4px;}
.paste-opt-btn{padding:14px;border:2px solid var(--border);border-radius:12px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;background:var(--card);color:var(--text);text-align:left;}
.paste-opt-btn small{display:block;font-size:11px;font-weight:400;color:var(--muted);margin-top:3px;}
.day-modal-empty{color:var(--muted);font-size:13px;text-align:center;padding:16px 0;}
.btn-day-add{background:var(--c영대);color:#fff;border:none;border-radius:11px;padding:12px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;width:100%;margin-top:10px;}
/* 폼 */
.fg{margin-bottom:13px;}
.fl{font-size:11px;font-weight:700;color:var(--muted);margin-bottom:5px;display:block;letter-spacing:0.3px;}
.fi,.ft{width:100%;border:1.5px solid var(--border);border-radius:10px;padding:9px 11px;font-size:13px;font-family:inherit;background:var(--bg);color:var(--text);outline:none;transition:border-color 0.2s;}
.fi:focus,.ft:focus{border-color:var(--c영대);background:#fff;}
.ft{resize:vertical;min-height:85px;}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.time-hint{font-size:10px;color:var(--muted);margin-top:4px;}
.who-sel{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;}
.who-sel::-webkit-scrollbar{display:none;}
.who-btn{border:2px solid transparent;border-radius:8px;padding:6px 11px;font-size:12px;font-weight:700;font-family:inherit;cursor:pointer;transition:all 0.2s;opacity:0.45;white-space:nowrap;flex-shrink:0;}
.who-btn[data-w="유영대"]{background:var(--l영대);color:var(--c영대);border-color:var(--c영대);}
.who-btn[data-w="이현희"]{background:var(--l현희);color:var(--c현희);border-color:var(--c현희);}
.who-btn[data-w="유제하"]{background:var(--l제하);color:var(--c제하);border-color:var(--c제하);}
.who-btn[data-w="유가율"]{background:var(--l가율);color:var(--c가율);border-color:var(--c가율);}
.who-btn[data-w="유가은"]{background:var(--l가은);color:var(--c가은);border-color:var(--c가은);}
.who-btn.on{opacity:1;box-shadow:0 2px 6px rgba(0,0,0,0.15);}
.btn-save{background:var(--c영대);color:#fff;border:none;border-radius:12px;padding:13px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;width:100%;margin-top:6px;}
.btn-del{background:#fef2f2;color:#ef4444;border:none;border-radius:12px;padding:11px;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer;width:100%;margin-top:8px;}
.det-badges{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px;}
.det-badge{border-radius:8px;padding:3px 11px;font-size:12px;font-weight:700;}
.det-title{font-size:20px;font-weight:900;margin-bottom:13px;}
.det-field{margin-bottom:9px;}
.det-lbl{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:0.3px;margin-bottom:3px;}
.det-val{font-size:13px;font-weight:500;}
.btn-edit-det{background:var(--bg);color:var(--text);border:1.5px solid var(--border);border-radius:12px;padding:11px;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer;width:100%;margin-top:10px;}
.loading-overlay{position:fixed;inset:0;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;gap:14px;}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--c영대);border-radius:50%;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.toast{position:fixed;bottom:65px;left:50%;transform:translateX(-50%) translateY(10px);background:#2d2520;color:#fff;border-radius:20px;padding:8px 16px;font-size:12px;font-weight:600;opacity:0;transition:all 0.3s;z-index:999;white-space:nowrap;pointer-events:none;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.empty-msg{text-align:center;padding:36px 16px;color:var(--muted);font-size:13px;}
</style>
</head>
<body>
<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <div style="font-size:13px;color:#9e9488;font-weight:600;">가족 일정 불러오는 중... 🏠</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

import { getStorage, ref, uploadBytes, getDownloadURL, deleteObject, listAll, getMetadata } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";

const FB={apiKey:"AIzaSyBk1bMw7zutUQXxCWs_fY8Jh5XAYd-M7Zs",authDomain:"family-calendar-yoo.firebaseapp.com",projectId:"family-calendar-yoo",storageBucket:"family-calendar-yoo.firebasestorage.app",messagingSenderId:"29463720385",appId:"1:29463720385:web:995328e6ee09e81daaff40"};
const HOLIDAY_KEY="09b819905e0a70316749fb91c03a216633ad3e75196a6aa25e6a9f273d9116f8";
const app=initializeApp(FB),db=getFirestore(app),storage=getStorage(app);
const CC={'유영대':'#3b82f6','이현희':'#f472b6','유제하':'#34d399','유가율':'#fb923c','유가은':'#a78bfa'};
const CL={'유영대':'#eff6ff','이현희':'#fdf2f8','유제하':'#ecfdf5','유가율':'#fff7ed','유가은':'#f5f3ff'};

let events=[],curMonth=new Date(),filters=[],editId=null;
let selWho=[],sFilter='all',detailEv=null,searchSort='date-desc';
let longPressTimer=null,copiedEvent=null,pendingCopyEv=null;
let pasteTargetDate=null,multiPasteMode=false,multiPasteDates=new Set();
const holidayCache={};
let multiSelectMode=false,selectedIds=new Set();
let viewerScale=1,viewerOffX=0,viewerOffY=0,viewerLastScale=1,viewerStartDist=0,viewerStartX=0,viewerStartY=0;
let currentPhotoEventId=null;

// 사진 여러 장 — 최대 장수
const MAX_PHOTOS=5;
// 수정 모달에서 새로 고른 파일들 / 기존 사진 중 남길 URL들
let editNewFiles=[],editKeptUrls=[];
// 뷰어가 현재 보고 있는 사진 목록과 위치
let viewerUrls=[],viewerIdx=0;

// 뒤로가기
window.addEventListener('popstate',()=>{if(confirm('앱을 종료하시겠습니까?')){window.close();}else{history.pushState(null,'',location.href);}});
history.pushState(null,'',location.href);

// KST 오늘 날짜
function getTodayKST(){const kst=new Date(Date.now()+9*60*60*1000);return kst.toISOString().slice(0,10);}

// 시간 포맷
window.formatTime=function(input){let v=input.value.replace(/[^0-9]/g,'');if(v.length>=3)v=v.slice(0,2)+':'+v.slice(2,4);input.value=v;}

// 공휴일
async function getHolidays(year){
  if(holidayCache[year]) return holidayCache[year];
  const map={};
  try{
    await Promise.all(['01','02','03','04','05','06','07','08','09','10','11','12'].map(async mo=>{
      const url=`https://apis.data.go.kr/B090041/openapi/service/SpcdeInfoService/getRestDeInfo?solYear=${year}&solMonth=${mo}&ServiceKey=${HOLIDAY_KEY}&numOfRows=30&_type=json`;
      const res=await fetch(url);const data=await res.json();
      const items=data?.response?.body?.items?.item;if(!items) return;
      (Array.isArray(items)?items:[items]).forEach(item=>{
        const ds=String(item.locdate);
        const key=`${ds.slice(0,4)}-${ds.slice(4,6)}-${ds.slice(6,8)}`;
        if(!map[key]) map[key]=item.dateName;
      });
    }));
  }catch(e){}
  holidayCache[year]=map;return map;
}
function preloadHolidaysBg(year){
  Promise.all([getHolidays(year-1),getHolidays(year),getHolidays(year+1)]).then(()=>renderCal());
}
preloadHolidaysBg(new Date().getFullYear());

// Firebase
const q=query(collection(db,"events"),orderBy("date","asc"));
onSnapshot(q,snap=>{
  events=[];snap.forEach(d=>events.push({id:d.id,...d.data()}));
  renderAll();document.getElementById('loadingOverlay').style.display='none';
},err=>{document.getElementById('loadingOverlay').style.display='none';showToast('⚠️ 연결 실패');});

function expand(evs){
  const res=[],now=new Date();
  const s=new Date(now.getFullYear(),now.getMonth()-3,1);
  const e=new Date(now.getFullYear(),now.getMonth()+9,0);
  evs.forEach(ev=>{
    if(!ev.repeat||ev.repeat==='none'){res.push(ev);return;}
    let d=new Date(ev.date+'T00:00:00'),cnt=0;
    while(d<=e&&cnt<500){
      if(d>=s) res.push({...ev,date:d.toISOString().slice(0,10),_v:true,_oid:ev.id});
      cnt++;
      if(ev.repeat==='daily') d.setDate(d.getDate()+1);
      else if(ev.repeat==='weekly') d.setDate(d.getDate()+7);
      else if(ev.repeat==='monthly') d.setMonth(d.getMonth()+1);
      else if(ev.repeat==='yearly') d.setFullYear(d.getFullYear()+1);
      else break;
    }
  });
  return res;
}
function applyFilter(evs){
  if(!filters.length) return evs;
  return evs.filter(ev=>{const w=Array.isArray(ev.who)?ev.who:[ev.who];return filters.some(f=>w.includes(f));});
}
function renderAll(){renderToday();renderCal();renderList();doSearch();renderPhotoTab();}

// 오늘
function renderToday(){
  const ts=getTodayKST();
  const d=new Date(Date.now()+9*60*60*1000);
  document.getElementById('todayBadge').textContent=`${d.getUTCMonth()+1}월 ${d.getUTCDate()}일`;
  const evs=applyFilter(expand(events)).filter(ev=>ev.date===ts).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
  const el=document.getElementById('todayEvs');
  if(!evs.length){el.innerHTML='<div class="today-empty">오늘 일정 없음 🎉</div>';return;}
  el.innerHTML=evs.map(ev=>evCardHtml(ev,false,true)).join('');
  bindCardLongPress(el);
}

// 카드 오른쪽 썸네일. 사진이 2장 이상이면 오른쪽 아래에 "+N" 표시
function thumbHtml(ev,id){
  const photos=getPhotos(ev);
  if(!photos.length) return '';
  const more=photos.length>1?`<span class="ev-photo-more">+${photos.length-1}</span>`:'';
  return `<div class="ev-photo-wrap" onclick="event.stopPropagation();openEventPhotos('${id}',0)">
    <img class="ev-photo" src="${photos[0]}" loading="lazy">${more}
  </div>`;
}

function evCardHtml(ev,showDate=false,canCopy=false){
  const who=Array.isArray(ev.who)?ev.who:[ev.who];
  const color=CC[who[0]]||'#888';
  const id=ev._v?ev._oid:ev.id;
  const attr=canCopy?`data-id="${id}" data-date="${ev.date}"`:'';
  const photoHtml=thumbHtml(ev,id);
  return `<div class="ev-card" style="border-left-color:${color}" ${attr} onclick="openDetail('${id}','${ev.date}')">
    <div class="ev-dot" style="background:${color}"></div>
    <div class="ev-info">
      <div class="ev-title">${ev.title}</div>
      <div class="ev-meta">
        ${ev.time&&!showDate?`<span class="ev-time">⏰ ${ev.time}</span>`:''}
        ${who.map(w=>`<span class="who-tag" style="background:${CL[w]||'#eee'};color:${CC[w]||'#333'}">${w.slice(1)}</span>`).join('')}
      </div>
      ${ev.body?`<div class="ev-body">📝 ${ev.body}</div>`:''}
      ${showDate?`<div class="ev-date-lbl">📅 ${ev.date}${ev.time?' · '+ev.time:''}</div>`:''}
    </div>
    ${photoHtml}
  </div>`;
}

// 달력
function renderCal(){
  const yr=curMonth.getFullYear(),mo=curMonth.getMonth();
  document.getElementById('monthLbl').textContent=`${yr}년 ${mo+1}월`;
  const today=getTodayKST();
  const expanded=applyFilter(expand(events));
  const holidays=holidayCache[yr]||{};
  const firstDow=new Date(yr,mo,1).getDay();
  const lastDate=new Date(yr,mo+1,0).getDate();
  const prevLast=new Date(yr,mo,0).getDate();
  let html='';
  for(let i=firstDow-1;i>=0;i--) html+=`<div class="cal-day other"><div class="dnum">${prevLast-i}</div></div>`;
  for(let d=1;d<=lastDate;d++){
    const ds=`${yr}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dow=new Date(yr,mo,d).getDay();
    const hName=holidays[ds]||'';
    let cls='cal-day';
    if(ds===today) cls+=' today';
    if(dow===0) cls+=' sun'; if(dow===6) cls+=' sat';
    if(hName) cls+=' holiday-day';
    if(multiPasteMode&&multiPasteDates.has(ds)) cls+=' paste-selected';
    const filtEvs=expanded.filter(ev=>ev.date===ds).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
    const chips=filtEvs.slice(0,2).map(ev=>{
      const who=Array.isArray(ev.who)?ev.who:[ev.who];
      return `<div class="d-chip" style="background:${CL[who[0]]||'#eee'};color:${CC[who[0]]||'#888'}">${ev.time?ev.time.slice(0,5)+' ':''}${ev.title}</div>`;
    }).join('');
    const more=filtEvs.length>2?`<div class="d-more">+${filtEvs.length-2}</div>`:'';
    const dnumStyle=(hName&&dow!==0&&dow!==6)?'style="color:#ef4444"':'';
    html+=`<div class="${cls}" data-date="${ds}" onclick="handleDayTap('${ds}')" oncontextmenu="event.preventDefault()">
      <div class="dnum" ${dnumStyle}>${d}</div>

  const past=allEvs.filter(ev=>ev.date<today).sort((a,b)=>{

    html+=Object.entries(monthGroups).sort((a,b)=>b[0].localeCompare(a[0])).map(([ym,evs])=>{
      const [y,m]=ym.split('-');

// ── 사진 기능 ──
// 일정의 사진 목록을 배열로 돌려준다.
// 예전 일정은 photoUrl(한 장), 새 일정은 photoUrls(여러 장)를 쓰므로 둘 다 읽는다.
function getPhotos(ev){
  if(!ev) return [];
  if(Array.isArray(ev.photoUrls)) return ev.photoUrls.filter(Boolean);
  return ev.photoUrl?[ev.photoUrl]:[];
}
// 사진 목록을 저장할 때 쓰는 값. 예전 photoUrl은 비워서 중복을 막는다.
function photoFields(urls){return{photoUrls:urls,photoUrl:''};}
// Storage에서 사진 파일들을 지운다 (실패해도 넘어간다)
async function deletePhotoFiles(urls){
  await Promise.all(urls.map(async u=>{try{await deleteObject(ref(storage,u));}catch(e){}}));
}

function compressImage(file,maxSize=800,quality=0.65){
  return new Promise(resolve=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        const canvas=document.createElement('canvas');
        let w=img.width,h=img.height;
        if(w>maxSize||h>maxSize){if(w>h){h=Math.round(h*maxSize/w);w=maxSize;}else{w=Math.round(w*maxSize/h);h=maxSize;}}
        canvas.width=w;canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        canvas.toBlob(resolve,'image/jpeg',quality);
      };
      img.src=e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

async function uploadPhoto(file,eventId,seq=0){
  const compressed=await compressImage(file);
  const storageRef=ref(storage,`photos/${eventId}_${Date.now()}_${seq}.jpg`);
  await uploadBytes(storageRef,compressed);
  return await getDownloadURL(storageRef);
}

// 사진 탭
function renderPhotoTab(){
  const evs=events.filter(ev=>getPhotos(ev).length).sort((a,b)=>b.date.localeCompare(a.date));
  const grid=document.getElementById('photoGrid');
  const empty=document.getElementById('photoEmpty');
  if(!evs.length){grid.innerHTML='';empty.style.display='block';calcStorageSize();document.getElementById('cleanupBtn').style.display='none';return;}
  empty.style.display='none';
  const groups={};evs.forEach(ev=>{if(!groups[ev.date])groups[ev.date]=[];groups[ev.date].push(ev);});
  grid.innerHTML=Object.entries(groups).map(([date,evs])=>{
    const d=new Date(date+'T00:00:00');
    const dow=['일','월','화','수','목','금','토'][d.getDay()];
    // 한 일정에 사진이 여러 장이면 각각 따로 칸을 만든다
    const items=evs.flatMap(ev=>getPhotos(ev).map((u,i)=>
      `<div class="photo-grid-item" onclick="openEventPhotos('${ev.id}',${i})">
        <img src="${u}" loading="lazy">
      </div>`)).join('');
    return `<div class="photo-grid-date">${d.getMonth()+1}월 ${d.getDate()}일 (${dow})</div>`+items;
  }).join('');
  // 용량 계산
  calcStorageSize();
  // 1년 이상 정리 버튼
  const oneYearAgo=new Date();oneYearAgo.setFullYear(oneYearAgo.getFullYear()-1);
  const oldEvs=events.filter(ev=>getPhotos(ev).length&&new Date(ev.date+'T00:00:00')<oneYearAgo);
  const oldCount=oldEvs.reduce((n,ev)=>n+getPhotos(ev).length,0);
  const cleanBtn=document.getElementById('cleanupBtn');
  if(oldCount>0){cleanBtn.style.display='block';cleanBtn.textContent=`🗑️ 1년 이상 된 사진 정리 (${oldCount}장)`;}
  else{cleanBtn.style.display='none';}
}

async function calcStorageSize(){
  try{
    const listRef=ref(storage,'photos/');
    const result=await listAll(listRef);
    let totalBytes=0;
    await Promise.all(result.items.map(async item=>{
      const meta=await getMetadata(item);
      totalBytes+=meta.size||0;
    }));
    const mb=totalBytes/1024/1024;
    const gb=mb/1024;
    const pct=Math.min((gb/5)*100,100);
    let sizeText='';
    if(mb<1) sizeText=`${Math.round(totalBytes/1024)}KB / 5GB`;
    else if(mb<1024) sizeText=`${mb.toFixed(1)}MB / 5GB`;
    else sizeText=`${gb.toFixed(2)}GB / 5GB`;
    document.getElementById('storageSizeText').textContent=sizeText;
    document.getElementById('storageBar').style.width=pct+'%';
    if(pct>80) document.getElementById('storageBar').style.background='#ef4444';
    else if(pct>60) document.getElementById('storageBar').style.background='#f59e0b';
  }catch(e){document.getElementById('storageSizeText').textContent='용량 확인 불가';}
}

window.cleanupOldPhotos=async function(){
  const oneYearAgo=new Date();oneYearAgo.setFullYear(oneYearAgo.getFullYear()-1);
  const oldEvs=events.filter(ev=>getPhotos(ev).length&&new Date(ev.date+'T00:00:00')<oneYearAgo);
  const oldCount=oldEvs.reduce((n,ev)=>n+getPhotos(ev).length,0);
  if(!oldCount){showToast('정리할 사진이 없어요');return;}
  if(!confirm(`1년 이상 된 사진 ${oldCount}장을 삭제할까요?\n일정은 유지되고 사진만 삭제돼요.`)) return;
  try{
    await Promise.all(oldEvs.map(async ev=>{
      const photos=getPhotos(ev);
      await updateDoc(doc(db,"events",ev.id),photoFields([]));
      await deletePhotoFiles(photos);
    }));
    showToast(`✅ ${oldCount}장 정리됐어요!`);
    renderPhotoTab();
  }catch(e){showToast('⚠️ 정리 실패');}
}

// 사진 뷰어 — 사진 목록을 받아서 좌우로 넘길 수 있다
function openViewer(urls,idx,evId){
  viewerUrls=urls.filter(Boolean);
  if(!viewerUrls.length) return;
  viewerIdx=Math.min(Math.max(idx||0,0),viewerUrls.length-1);
  currentPhotoEventId=evId||null;
  document.getElementById('photoViewerDel').style.display=evId?'block':'none';
  showViewerPhoto();
  document.getElementById('photoViewer').classList.add('open');
  setupViewerPinch();
}
function showViewerPhoto(){
  document.getElementById('photoViewerImg').src=viewerUrls[viewerIdx];
  const many=viewerUrls.length>1;
  document.getElementById('photoViewerPrev').classList.toggle('show',many);
  document.getElementById('photoViewerNext').classList.toggle('show',many);
  const cnt=document.getElementById('photoViewerCount');
  cnt.classList.toggle('show',many);
  cnt.textContent=`${viewerIdx+1} / ${viewerUrls.length}`;
  viewerScale=1;viewerOffX=0;viewerOffY=0;
  applyViewerTransform();
}
window.viewerStep=function(d){
  if(viewerUrls.length<2) return;
  viewerIdx=(viewerIdx+d+viewerUrls.length)%viewerUrls.length;
  showViewerPhoto();
}
// 일정 id로 그 일정의 사진들을 뷰어에 띄운다
window.openEventPhotos=function(evId,idx){
  const ev=events.find(e=>e.id===evId);
  openViewer(getPhotos(ev),idx||0,evId);
}
window.closePhotoViewer=function(){document.getElementById('photoViewer').classList.remove('open');currentPhotoEventId=null;viewerUrls=[];viewerIdx=0;}
function applyViewerTransform(){
  const img=document.getElementById('photoViewerImg');
  img.style.transform=`translate(calc(-50% + ${viewerOffX}px),calc(-50% + ${viewerOffY}px)) scale(${viewerScale})`;
}
function setupViewerPinch(){
  const wrap=document.getElementById('photoViewerWrap');
  wrap.ontouchstart=e=>{
    if(e.touches.length===2){viewerStartDist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);viewerLastScale=viewerScale;}
    else if(e.touches.length===1){viewerStartX=e.touches[0].clientX-viewerOffX;viewerStartY=e.touches[0].clientY-viewerOffY;}
  };
  wrap.ontouchmove=e=>{
    e.preventDefault();
    if(e.touches.length===2){const dist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);viewerScale=Math.min(5,Math.max(1,viewerLastScale*(dist/viewerStartDist)));}
    else if(e.touches.length===1){viewerOffX=e.touches[0].clientX-viewerStartX;viewerOffY=e.touches[0].clientY-viewerStartY;}
    applyViewerTransform();
  };
  wrap.ontouchend=()=>{if(viewerScale<=1){viewerOffX=0;viewerOffY=0;applyViewerTransform();}};
}
// 지금 보고 있는 사진 한 장만 삭제
window.deleteEventPhoto=async function(){
  if(!currentPhotoEventId) return;
  const target=viewerUrls[viewerIdx];
  if(!target) return;
  const many=viewerUrls.length>1;
  if(!confirm(many?`이 사진(${viewerIdx+1}/${viewerUrls.length})만 삭제할까요?\n나머지 사진과 일정은 유지됩니다.`:'사진을 삭제할까요?\n일정은 유지됩니다.')) return;
  try{
    const ev=events.find(e=>e.id===currentPhotoEventId);
    const rest=getPhotos(ev).filter(u=>u!==target);
    await updateDoc(doc(db,"events",currentPhotoEventId),photoFields(rest));
    await deletePhotoFiles([target]);
    showToast('🗑️ 사진 삭제됐어요');
    if(!rest.length){closePhotoViewer();return;}
    // 남은 사진으로 계속 보기
    viewerUrls=rest;
    if(viewerIdx>=viewerUrls.length) viewerIdx=viewerUrls.length-1;
    showViewerPhoto();
  }catch(e){showToast('⚠️ 삭제 실패');}
}

// CRUD
window.saveEvent=async function(){
  const title=document.getElementById('f_title').value.trim();
  const date=document.getElementById('f_date').value;
  const time=document.getElementById('f_time').value.trim();
  const body=document.getElementById('f_body').value.trim();
  if(!title){showToast('제목을 입력해주세요');return;}
  if(!date){showToast('날짜를 선택해주세요');return;}
  if(!selWho.length){showToast('구성원을 선택해주세요');return;}
  const timeVal=time&&/^\d{1,2}:\d{2}$/.test(time)?time:'';
  const data={title,date,time:timeVal,body,who:selWho,repeat:'none'};
  try{
    let savedId=editId;
    // 수정 중이라면, 빼기(✕)한 기존 사진이 무엇인지 미리 계산
    const before=editId?getPhotos(events.find(e=>e.id===editId)):[];
    const dropped=before.filter(u=>!editKeptUrls.includes(u));

    if(editId){await updateDoc(doc(db,"events",editId),data);}
    else{const docRef=await addDoc(collection(db,"events"),data);savedId=docRef.id;}

    if(savedId&&(editNewFiles.length||dropped.length)){
      let urls=[...editKeptUrls];
      if(editNewFiles.length){
        showToast(`📷 사진 ${editNewFiles.length}장 업로드 중...`);
        const uploaded=await Promise.all(editNewFiles.map((f,i)=>uploadPhoto(f,savedId,i)));
        urls=urls.concat(uploaded);
      }
      await updateDoc(doc(db,"events",savedId),photoFields(urls));
      // 문서를 먼저 고친 뒤에 실제 파일을 지운다 (중간에 끊겨도 깨진 링크가 남지 않게)
      if(dropped.length) await deletePhotoFiles(dropped);
    }
    showToast(editId?'✅ 수정됐어요!':'✅ 저장됐어요!');
    resetEditPhotos();closeModal('editModal');
  }catch(e){showToast('⚠️ 저장 실패: '+e.message);}
}
// 수정 모달 사진 상태 비우기
function resetEditPhotos(){
  editNewFiles.forEach(f=>{if(f._previewUrl) URL.revokeObjectURL(f._previewUrl);});
  editNewFiles=[];editKeptUrls=[];
  document.getElementById('editPhotoInput').value='';
}
window.deleteEvent=async function(){
  if(!editId||!confirm('이 일정을 삭제할까요?')) return;
  try{
    const ev=events.find(e=>e.id===editId);
    const photos=getPhotos(ev);
    await deleteDoc(doc(db,"events",editId));
    if(photos.length) await deletePhotoFiles(photos);
    showToast('🗑️ 삭제됐어요');closeModal('editModal');
  }catch(e){showToast('⚠️ 삭제 실패');}
}
window.openDetail=function(id,dateStr){
  const ev=events.find(e=>e.id===id);if(!ev) return;
  detailEv={...ev,_viewDate:dateStr};
  const who=Array.isArray(ev.who)?ev.who:[ev.who];
  document.getElementById('detailContent').innerHTML=`
    <div class="det-badges">${who.map(w=>`<span class="det-badge" style="background:${CL[w]||'#eee'};color:${CC[w]||'#333'}">${w}</span>`).join('')}</div>
    <div class="det-title">${ev.title}</div>
    <div class="det-field"><div class="det-lbl">📅 날짜 · 시간</div><div class="det-val">${dateStr}${ev.time?' · '+ev.time:''}</div></div>
    ${ev.body?`<div class="det-field"><div class="det-lbl">📝 내용</div><div class="det-val" style="white-space:pre-wrap">${ev.body}</div></div>`:''}
    ${(()=>{const ps=getPhotos(ev);if(!ps.length) return '';
      return `<div class="det-field"><div class="det-lbl">📷 사진 ${ps.length>1?`(${ps.length}장)`:''}</div>
        <div class="det-photos">${ps.map((u,i)=>`<img src="${u}" loading="lazy" onclick="openEventPhotos('${id}',${i})">`).join('')}</div></div>`;})()}
  `;
  openModal('detailModal');
}
window.editFromDetail=function(){if(!detailEv) return;closeModal('detailModal');setTimeout(()=>openAdd(null,detailEv.id),300);}

// 공통
window.openAdd=function(dateStr,eid){
  editId=eid||null;selWho=[];
  resetEditPhotos();
  document.getElementById('maxPhotoHint').textContent=MAX_PHOTOS;
  document.getElementById('f_title').value='';document.getElementById('f_date').value=dateStr||getTodayKST();
  document.getElementById('f_time').value='';document.getElementById('f_body').value='';
  document.querySelectorAll('.who-btn').forEach(b=>b.classList.remove('on'));
  document.getElementById('btnDel').style.display='none';document.getElementById('editModalTxt').textContent='일정 추가';
  if(eid){
    const ev=events.find(e=>e.id===eid);
    if(ev){
      document.getElementById('editModalTxt').textContent='일정 수정';
      document.getElementById('f_title').value=ev.title||'';document.getElementById('f_date').value=ev.date||'';
      document.getElementById('f_time').value=ev.time||'';document.getElementById('f_body').value=ev.body||'';
      selWho=Array.isArray(ev.who)?[...ev.who]:[ev.who];
      selWho.forEach(w=>{const b=document.querySelector(`.who-btn[data-w="${w}"]`);if(b)b.classList.add('on');});
      document.getElementById('btnDel').style.display='block';
      editKeptUrls=getPhotos(ev);
    }
  }
  renderEditPhotos();
  openModal('editModal');
}
window.toggleWho=function(btn){const w=btn.dataset.w;if(btn.classList.contains('on')){btn.classList.remove('on');selWho=selWho.filter(x=>x!==w);}else{btn.classList.add('on');selWho.push(w);}}
window.switchTab=function(tab,btn){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('on'));btn.classList.add('on');
  document.getElementById('calTab').style.display=tab==='cal'?'':'none';
  document.getElementById('listTab').style.display=tab==='list'?'':'none';
  document.getElementById('searchTab').style.display=tab==='search'?'':'none';
  document.getElementById('photoTab').style.display=tab==='photo'?'':'none';
  document.getElementById('filterWrap').style.display=(tab==='search'||tab==='photo')?'none':'';
  document.getElementById('todayBox').style.display=(tab==='search'||tab==='photo')?'none':'';
  if(tab==='search') setTimeout(()=>document.getElementById('searchInput').focus(),300);
  if(tab==='photo') renderPhotoTab();
}
window.openModal=function(id){document.getElementById(id).classList.add('open');}
window.closeModal=function(id){document.getElementById(id).classList.remove('open');}
window.bgClose=function(e,id){if(e.target===document.getElementById(id))closeModal(id);}
window.showToast=function(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}

// ── 서비스 워커: 항상 최신 버전 불러오기 ──
if('serviceWorker' in navigator){
  // 이미 워커가 일하고 있었는지 기억해둔다 (첫 설치 때는 새로고침하지 않기 위해)
  const hadController=!!navigator.serviceWorker.controller;
  let reloaded=false;

  // 새 워커가 일을 넘겨받으면 = 새 버전이 준비됨 → 한 번만 새로고침
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(!hadController||reloaded) return;
    reloaded=true;
    showToast('🆕 새 버전으로 바꾸는 중...');
    setTimeout(()=>location.reload(),600);
  });

  window.addEventListener('load',()=>{
    // updateViaCache:'none' — sw.js 자체는 절대 캐시에서 읽지 않는다.
    // 이게 없으면 새 워커를 최대 10분 늦게 발견한다.
    navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(reg=>{
      // 앱을 다시 볼 때마다 새 버전이 있는지 확인
      document.addEventListener('visibilitychange',()=>{
        if(document.visibilityState==='visible') reg.update().catch(()=>{});
      });
      // 대기 중인 새 워커가 있으면 바로 교체 요청
      if(reg.waiting) reg.waiting.postMessage('skipWaiting');
      reg.addEventListener('updatefound',()=>{
        const nw=reg.installing;
        if(!nw) return;
        nw.addEventListener('statechange',()=>{
          if(nw.state==='installed'&&navigator.serviceWorker.controller) nw.postMessage('skipWaiting');
        });
      });
    }).catch(()=>{ /* 등록 실패해도 앱은 그대로 동작한다 */ });
  });
}

// ── 비상 탈출구 ──
// 버전 숫자(v5.5)를 3초간 꾹 누르면 서비스 워커와 캐시를 전부 지우고 새로 받는다.
// 업데이트가 꼬였을 때 앱을 지우고 재설치하지 않아도 되도록 넣어둔 장치.
(function(){
  const badge=document.querySelector('.app-version');
  if(!badge) return;
  let t=null;
  const start=()=>{t=setTimeout(async()=>{
    if(!confirm('앱 캐시를 전부 비우고 새로 받을까요?\n일정 데이터는 서버에 있으니 지워지지 않습니다.')) return;
    try{
      if('serviceWorker' in navigator){
        const regs=await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map(r=>r.unregister()));
      }
      if(window.caches){
        const keys=await caches.keys();
        await Promise.all(keys.map(k=>caches.delete(k)));
      }
    }catch(e){}
    location.replace(location.pathname+'?fresh='+Date.now());
  },3000);};
  const stop=()=>{if(t){clearTimeout(t);t=null;}};
  badge.style.cursor='pointer';
  badge.addEventListener('touchstart',start,{passive:true});
  badge.addEventListener('touchend',stop,{passive:true});
  badge.addEventListener('touchmove',stop,{passive:true});
  badge.addEventListener('mousedown',start);
  badge.addEventListener('mouseup',stop);
  badge.addEventListener('mouseleave',stop);
})();
</script>
