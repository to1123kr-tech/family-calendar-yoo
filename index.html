<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="유씨네 달력">
<title>유씨네 가족 달력 🏠</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f7f5f0;
  --card: #ffffff;
  --border: #e5e0d5;
  --text: #1a1614;
  --text-muted: #8a8078;
  --shadow: 0 2px 16px rgba(0,0,0,0.08);
  --c영대: #2563eb; --l영대: #dbeafe;
  --c현희: #e91e8c; --l현희: #fce4f3;
  --c제하: #16a34a; --l제하: #dcfce7;
  --c가율: #ea580c; --l가율: #ffedd5;
  --c가은: #7c3aed; --l가은: #ede9fe;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-tap-highlight-color:transparent;}

/* 헤더 */
.app-header{background:var(--card);border-bottom:1px solid var(--border);padding:16px 20px 12px;position:sticky;top:0;z-index:100;box-shadow:var(--shadow);}
.header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.app-title{font-size:20px;font-weight:900;letter-spacing:-0.5px;}
.app-title span{color:var(--c영대);}
.btn-add-main{background:var(--c영대);color:white;border:none;border-radius:50px;padding:8px 18px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;transition:all 0.2s;}
.btn-add-main:hover{background:#1d4ed8;}

.family-filter{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;}
.family-filter::-webkit-scrollbar{display:none;}
.filter-btn{border:2px solid var(--border);border-radius:50px;padding:5px 14px;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;white-space:nowrap;transition:all 0.2s;background:var(--bg);color:var(--text-muted);}
.filter-btn.f-all.active{background:var(--text);color:white;border-color:var(--text);}
.filter-btn[data-f="유영대"].active{background:var(--c영대);color:white;border-color:var(--c영대);}
.filter-btn[data-f="이현희"].active{background:var(--c현희);color:white;border-color:var(--c현희);}
.filter-btn[data-f="유제하"].active{background:var(--c제하);color:white;border-color:var(--c제하);}
.filter-btn[data-f="유가율"].active{background:var(--c가율);color:white;border-color:var(--c가율);}
.filter-btn[data-f="유가은"].active{background:var(--c가은);color:white;border-color:var(--c가은);}

.tab-nav{display:flex;background:var(--card);border-bottom:1px solid var(--border);}
.tab-btn{flex:1;padding:12px;border:none;background:transparent;font-family:inherit;font-size:13px;font-weight:600;color:var(--text-muted);cursor:pointer;border-bottom:3px solid transparent;transition:all 0.2s;}
.tab-btn.active{color:var(--c영대);border-bottom-color:var(--c영대);}

.main-content{padding:16px;max-width:800px;margin:0 auto;}

.today-section{background:var(--card);border-radius:16px;padding:16px;margin-bottom:16px;box-shadow:var(--shadow);border-left:4px solid var(--c영대);}
.today-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.today-title{font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px;}
.today-badge{background:var(--c영대);color:white;border-radius:50px;padding:2px 10px;font-size:12px;font-weight:600;}
.today-empty{color:var(--text-muted);font-size:14px;text-align:center;padding:12px 0;}

.month-nav{display:flex;align-items:center;justify-content:center;gap:20px;margin-bottom:16px;}
.month-nav-btn{background:var(--card);border:1px solid var(--border);border-radius:50%;width:36px;height:36px;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.2s;box-shadow:var(--shadow);}
.month-label{font-size:20px;font-weight:900;letter-spacing:-0.5px;}

.calendar-grid{background:var(--card);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);}
.cal-weekdays{display:grid;grid-template-columns:repeat(7,1fr);background:#f0ede8;}
.cal-weekday{text-align:center;padding:10px 0;font-size:12px;font-weight:700;color:var(--text-muted);}
.cal-weekday:first-child{color:#dc2626;}
.cal-weekday:last-child{color:#2563eb;}
.cal-days{display:grid;grid-template-columns:repeat(7,1fr);}
.cal-day{min-height:72px;border-top:1px solid var(--border);border-right:1px solid var(--border);padding:6px 4px 4px;cursor:pointer;transition:background 0.15s;}
.cal-day:hover{background:#fafaf8;}
.cal-day:nth-child(7n){border-right:none;}
.cal-day.other-month .day-num{color:#ccc;}
.cal-day.today .day-num{background:var(--c영대);color:white;border-radius:50%;}
.cal-day.sun .day-num{color:#dc2626;}
.cal-day.sat .day-num{color:#2563eb;}
.cal-day.today.sun .day-num,.cal-day.today.sat .day-num{color:white;}
.day-num{font-size:13px;font-weight:700;width:24px;height:24px;display:flex;align-items:center;justify-content:center;margin-bottom:3px;}
.day-events{display:flex;flex-direction:column;gap:2px;}
.day-chip{border-radius:4px;padding:1px 5px;font-size:10px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;}
.day-more{font-size:10px;color:var(--text-muted);padding-left:4px;}

.event-card{background:var(--card);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow);border-left:4px solid var(--border);cursor:pointer;transition:all 0.2s;display:flex;align-items:flex-start;gap:10px;margin-bottom:6px;}
.event-card:hover{transform:translateX(3px);}
.event-dot{width:10px;height:10px;border-radius:50%;margin-top:4px;flex-shrink:0;}
.event-info{flex:1;min-width:0;}
.event-title{font-size:14px;font-weight:700;margin-bottom:3px;}
.event-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
.event-time{font-size:12px;color:var(--text-muted);}
.who-tag{font-size:11px;font-weight:700;border-radius:50px;padding:1px 8px;}
.event-memo{font-size:12px;color:var(--text-muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

.date-label{font-size:12px;font-weight:700;color:var(--text-muted);margin:12px 0 6px 4px;letter-spacing:0.5px;}

/* 모달 */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:200;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity 0.3s;}
.modal-overlay.open{opacity:1;pointer-events:all;}
.modal-sheet{background:var(--card);border-radius:24px 24px 0 0;width:100%;max-width:600px;max-height:92vh;overflow-y:auto;padding:20px 20px 40px;transform:translateY(100%);transition:transform 0.35s cubic-bezier(0.34,1.2,0.64,1);}
.modal-overlay.open .modal-sheet{transform:translateY(0);}
.modal-handle{width:40px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 20px;}
.modal-title{font-size:18px;font-weight:900;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;}
.modal-close{background:var(--bg);border:none;border-radius:50%;width:32px;height:32px;font-size:16px;cursor:pointer;}

.form-group{margin-bottom:16px;}
.form-label{font-size:12px;font-weight:700;color:var(--text-muted);margin-bottom:6px;display:block;letter-spacing:0.5px;}
.form-input,.form-select,.form-textarea{width:100%;border:1.5px solid var(--border);border-radius:10px;padding:10px 12px;font-size:14px;font-family:inherit;background:var(--bg);color:var(--text);transition:border-color 0.2s;outline:none;}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--c영대);background:white;}
.form-textarea{resize:vertical;min-height:80px;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

.who-selector{display:flex;flex-wrap:wrap;gap:8px;}
.who-btn{border:2px solid var(--border);border-radius:50px;padding:6px 14px;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;background:transparent;color:var(--text-muted);transition:all 0.2s;}
.who-btn[data-w="유영대"].sel{background:var(--c영대);border-color:var(--c영대);color:white;}
.who-btn[data-w="이현희"].sel{background:var(--c현희);border-color:var(--c현희);color:white;}
.who-btn[data-w="유제하"].sel{background:var(--c제하);border-color:var(--c제하);color:white;}
.who-btn[data-w="유가율"].sel{background:var(--c가율);border-color:var(--c가율);color:white;}
.who-btn[data-w="유가은"].sel{background:var(--c가은);border-color:var(--c가은);color:white;}

.repeat-opts{display:flex;gap:6px;flex-wrap:wrap;}
.repeat-btn{border:1.5px solid var(--border);border-radius:8px;padding:6px 12px;font-size:12px;font-weight:600;font-family:inherit;cursor:pointer;background:transparent;color:var(--text-muted);transition:all 0.2s;}
.repeat-btn.sel{background:var(--c영대);border-color:var(--c영대);color:white;}

.checklist-wrap{display:flex;flex-direction:column;gap:6px;margin-bottom:8px;}
.check-item{display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:8px;padding:6px 10px;}
.check-item input[type="text"]{flex:1;border:none;background:transparent;font-family:inherit;font-size:13px;outline:none;}
.check-item .rm{background:none;border:none;cursor:pointer;color:var(--text-muted);font-size:18px;line-height:1;}
.btn-add-check{background:none;border:1.5px dashed var(--border);border-radius:8px;padding:8px;width:100%;font-size:13px;font-family:inherit;color:var(--text-muted);cursor:pointer;transition:all 0.2s;}
.btn-add-check:hover{border-color:var(--c영대);color:var(--c영대);}

.btn-save{background:var(--c영대);color:white;border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;width:100%;transition:all 0.2s;margin-top:8px;}
.btn-save:hover{background:#1d4ed8;}
.btn-del{background:#fee2e2;color:#dc2626;border:none;border-radius:12px;padding:12px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;width:100%;margin-top:8px;}

.detail-badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;}
.detail-badge{border-radius:50px;padding:4px 14px;font-size:13px;font-weight:700;}
.detail-ev-title{font-size:22px;font-weight:900;margin-bottom:16px;}
.d-field{margin-bottom:12px;}
.d-label{font-size:11px;font-weight:700;color:var(--text-muted);letter-spacing:0.5px;margin-bottom:4px;}
.d-val{font-size:14px;font-weight:500;}
.d-checklist{display:flex;flex-direction:column;gap:6px;}
.d-check-item{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--bg);border-radius:8px;cursor:pointer;}
.d-check-item input[type="checkbox"]{width:16px;height:16px;accent-color:var(--c영대);cursor:pointer;}
.d-check-item.done span{text-decoration:line-through;color:var(--text-muted);}
.btn-edit-detail{background:var(--bg);color:var(--text);border:none;border-radius:12px;padding:12px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;width:100%;margin-top:12px;}

.loading-overlay{position:fixed;inset:0;background:white;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;gap:16px;}
.spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--c영대);border-radius:50%;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);background:#1a1614;color:white;border-radius:50px;padding:10px 20px;font-size:13px;font-weight:600;opacity:0;transition:all 0.3s;z-index:999;white-space:nowrap;pointer-events:none;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.empty-msg{text-align:center;padding:40px 20px;color:var(--text-muted);font-size:14px;}
@media(min-width:600px){.main-content{padding:20px;}.cal-day{min-height:90px;}}
</style>
</head>
<body>

<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <div style="font-size:14px;color:#8a8078;font-weight:600;">유씨네 달력 불러오는 중...</div>
</div>
<div class="toast" id="toast"></div>

<!-- 헤더 -->
<header class="app-header">
  <div class="header-top">
    <div class="app-title">🏠 유씨네 <span>달력</span></div>
    <button class="btn-add-main" onclick="openAdd()">＋ 일정 추가</button>
  </div>
  <div class="family-filter">
    <button class="filter-btn f-all active" onclick="setFilter('all',this)">전체</button>
    <button class="filter-btn" data-f="유영대" onclick="setFilter('유영대',this)">👨 영대</button>
    <button class="filter-btn" data-f="이현희" onclick="setFilter('이현희',this)">👩 현희</button>
    <button class="filter-btn" data-f="유제하" onclick="setFilter('유제하',this)">🧑 제하</button>
    <button class="filter-btn" data-f="유가율" onclick="setFilter('유가율',this)">👧 가율</button>
    <button class="filter-btn" data-f="유가은" onclick="setFilter('유가은',this)">👶 가은</button>
  </div>
</header>

<div class="tab-nav">
  <button class="tab-btn active" onclick="switchTab('cal',this)">📅 달력</button>
  <button class="tab-btn" onclick="switchTab('list',this)">📋 목록</button>
</div>

<main class="main-content">
  <!-- 오늘 -->
  <div class="today-section">
    <div class="today-header">
      <div class="today-title">☀️ 오늘 일정 <span class="today-badge" id="todayBadge"></span></div>
    </div>
    <div id="todayEvents"><div class="today-empty">오늘 일정 없음 🎉</div></div>
  </div>

  <!-- 달력 -->
  <div id="calView">
    <div class="month-nav">
      <button class="month-nav-btn" onclick="changeMonth(-1)">◀</button>
      <div class="month-label" id="monthLabel"></div>
      <button class="month-nav-btn" onclick="changeMonth(1)">▶</button>
    </div>
    <div class="calendar-grid">
      <div class="cal-weekdays">
        <div class="cal-weekday">일</div><div class="cal-weekday">월</div>
        <div class="cal-weekday">화</div><div class="cal-weekday">수</div>
        <div class="cal-weekday">목</div><div class="cal-weekday">금</div>
        <div class="cal-weekday">토</div>
      </div>
      <div class="cal-days" id="calDays"></div>
    </div>
  </div>

  <!-- 목록 -->
  <div id="listView" style="display:none;">
    <div id="scheduleList"></div>
  </div>
</main>

<!-- 추가/수정 모달 -->
<div class="modal-overlay" id="editModal" onclick="bgClose(event,'editModal')">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title">
      <span id="modalTitleTxt">일정 추가</span>
      <button class="modal-close" onclick="closeModal('editModal')">✕</button>
    </div>
    <div class="form-group">
      <label class="form-label">제목 *</label>
      <input type="text" class="form-input" id="f_title" placeholder="일정 제목">
    </div>
    <div class="form-group">
      <label class="form-label">가족 구성원 * (복수 선택 가능)</label>
      <div class="who-selector">
        <button class="who-btn" data-w="유영대" onclick="toggleWho(this)">👨 영대</button>
        <button class="who-btn" data-w="이현희" onclick="toggleWho(this)">👩 현희</button>
        <button class="who-btn" data-w="유제하" onclick="toggleWho(this)">🧑 제하</button>
        <button class="who-btn" data-w="유가율" onclick="toggleWho(this)">👧 가율</button>
        <button class="who-btn" data-w="유가은" onclick="toggleWho(this)">👶 가은</button>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">날짜 *</label>
        <input type="date" class="form-input" id="f_date">
      </div>
      <div class="form-group">
        <label class="form-label">시간</label>
        <input type="time" class="form-input" id="f_time">
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">🔁 반복</label>
      <div class="repeat-opts">
        <button class="repeat-btn sel" data-r="none" onclick="setRepeat(this)">없음</button>
        <button class="repeat-btn" data-r="daily" onclick="setRepeat(this)">매일</button>
        <button class="repeat-btn" data-r="weekly" onclick="setRepeat(this)">매주</button>
        <button class="repeat-btn" data-r="monthly" onclick="setRepeat(this)">매월</button>
        <button class="repeat-btn" data-r="yearly" onclick="setRepeat(this)">매년</button>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">📍 장소</label>
      <input type="text" class="form-input" id="f_loc" placeholder="장소 이름 또는 주소">
    </div>
    <div class="form-group">
      <label class="form-label">📝 메모</label>
      <textarea class="form-textarea" id="f_memo" placeholder="준비물, 메모 등..."></textarea>
    </div>
    <div class="form-group">
      <label class="form-label">✅ 체크리스트</label>
      <div class="checklist-wrap" id="checkWrap"></div>
      <button class="btn-add-check" onclick="addCheck()">＋ 항목 추가</button>
    </div>
    <button class="btn-save" onclick="saveEvent()">💾 저장</button>
    <button class="btn-del" id="btnDel" style="display:none" onclick="deleteEvent()">🗑️ 삭제</button>
  </div>
</div>

<!-- 상세 모달 -->
<div class="modal-overlay" id="detailModal" onclick="bgClose(event,'detailModal')">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title">
      <span>일정 상세</span>
      <button class="modal-close" onclick="closeModal('detailModal')">✕</button>
    </div>
    <div id="detailContent"></div>
    <button class="btn-edit-detail" onclick="editFromDetail()">✏️ 수정하기</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, doc, updateDoc, deleteDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBk1bMw7zutUQXxCWs_fY8Jh5XAYd-M7Zs",
  authDomain: "family-calendar-yoo.firebaseapp.com",
  projectId: "family-calendar-yoo",
  storageBucket: "family-calendar-yoo.firebasestorage.app",
  messagingSenderId: "29463720385",
  appId: "1:29463720385:web:995328e6ee09e81daaff40"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
window.__db = db;

// 색상 맵
const CC = {
  '유영대':'#2563eb','이현희':'#e91e8c','유제하':'#16a34a','유가율':'#ea580c','유가은':'#7c3aed'
};
const CL = {
  '유영대':'#dbeafe','이현희':'#fce4f3','유제하':'#dcfce7','유가율':'#ffedd5','유가은':'#ede9fe'
};
window.CC = CC; window.CL = CL;

// 상태
let events = [];
let curMonth = new Date();
let activeFilter = 'all';
let editingId = null;
let selWho = [];
let selRepeat = 'none';
let checks = [];
let detailEv = null;

// Firestore 구독
const q = query(collection(db, "events"), orderBy("date","asc"));
onSnapshot(q, snap => {
  events = [];
  snap.forEach(d => events.push({id:d.id,...d.data()}));
  renderAll();
  document.getElementById('loadingOverlay').style.display='none';
}, err => {
  console.error(err);
  document.getElementById('loadingOverlay').style.display='none';
  showToast('⚠️ 연결 실패: '+err.message);
});

// 반복 펼치기
function expand(evs) {
  const res=[];
  const now=new Date();
  const s=new Date(now.getFullYear(),now.getMonth()-3,1);
  const e=new Date(now.getFullYear(),now.getMonth()+9,0);
  evs.forEach(ev=>{
    if(!ev.repeat||ev.repeat==='none'){res.push(ev);return;}
    let d=new Date(ev.date+'T00:00:00');
    let cnt=0;
    while(d<=e&&cnt<500){
      if(d>=s) res.push({...ev,date:d.toISOString().slice(0,10),_v:true,_oid:ev.id});
      cnt++;
      if(ev.repeat==='daily') d.setDate(d.getDate()+1);
      else if(ev.repeat==='weekly') d.setDate(d.getDate()+7);
      else if(ev.repeat==='monthly') d.setMonth(d.getMonth()+1);
      else if(ev.repeat==='yearly') d.setFullYear(d.getFullYear()+1);
      else break;
    }
  });
  return res;
}

function filtered(evs){
  if(activeFilter==='all') return evs;
  return evs.filter(ev=>{
    const w=Array.isArray(ev.who)?ev.who:[ev.who];
    return w.includes(activeFilter);
  });
}

function renderAll(){renderToday();renderCal();renderList();}

// 오늘
function renderToday(){
  const today=new Date();
  const ts=today.toISOString().slice(0,10);
  document.getElementById('todayBadge').textContent=`${today.getMonth()+1}월 ${today.getDate()}일`;
  const evs=filtered(expand(events)).filter(ev=>ev.date===ts);
  evs.sort((a,b)=>(a.time||'').localeCompare(b.time||''));
  const el=document.getElementById('todayEvents');
  if(!evs.length){el.innerHTML='<div class="today-empty">오늘 일정 없음 🎉</div>';return;}
  el.innerHTML=evs.map(ev=>eventCardHtml(ev)).join('');
}

function eventCardHtml(ev){
  const who=Array.isArray(ev.who)?ev.who:[ev.who];
  const color=CC[who[0]]||'#888';
  const light=CL[who[0]]||'#eee';
  const id=ev._v?ev._oid:ev.id;
  const rLabel={weekly:'🔁주',monthly:'🔁월',yearly:'🔁년',daily:'🔁일'}[ev.repeat]||'';
  return `<div class="event-card" style="border-left-color:${color}" onclick="openDetail('${id}','${ev.date}')">
    <div class="event-dot" style="background:${color}"></div>
    <div class="event-info">
      <div class="event-title">${ev.title} <small style="font-weight:400;color:#aaa">${rLabel}</small></div>
      <div class="event-meta">
        ${ev.time?`<span class="event-time">⏰ ${ev.time}</span>`:''}
        ${who.map(w=>`<span class="who-tag" style="background:${CL[w]||'#eee'};color:${CC[w]||'#333'}">${w.slice(1)}</span>`).join('')}
        ${ev.location?`<span class="event-time">📍 ${ev.location}</span>`:''}
      </div>
      ${ev.memo?`<div class="event-memo">📝 ${ev.memo}</div>`:''}
    </div>
  </div>`;
}

// 달력
function renderCal(){
  const year=curMonth.getFullYear();
  const month=curMonth.getMonth();
  document.getElementById('monthLabel').textContent=`${year}년 ${month+1}월`;
  const today=new Date().toISOString().slice(0,10);
  const expanded=filtered(expand(events));
  const firstDow=new Date(year,month,1).getDay();
  const lastDate=new Date(year,month+1,0).getDate();
  const prevLast=new Date(year,month,0).getDate();
  let html='';

  for(let i=firstDow-1;i>=0;i--)
    html+=`<div class="cal-day other-month"><div class="day-num">${prevLast-i}</div></div>`;

  for(let d=1;d<=lastDate;d++){
    const ds=`${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dow=new Date(year,month,d).getDay();
    let cls='cal-day';
    if(ds===today) cls+=' today';
    if(dow===0) cls+=' sun';
    if(dow===6) cls+=' sat';
    const dayEvs=expanded.filter(ev=>ev.date===ds).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
    const chips=dayEvs.slice(0,3).map(ev=>{
      const who=Array.isArray(ev.who)?ev.who:[ev.who];
      const c=CC[who[0]]||'#888';
      const l=CL[who[0]]||'#eee';
      const id=ev._v?ev._oid:ev.id;
      return `<div class="day-chip" style="background:${l};color:${c}" onclick="event.stopPropagation();openDetail('${id}','${ds}')">${ev.time?ev.time.slice(0,5)+' ':''}${ev.title}</div>`;
    }).join('');
    const more=dayEvs.length>3?`<div class="day-more">+${dayEvs.length-3}개</div>`:'';
    html+=`<div class="${cls}" onclick="openAdd('${ds}')">
      <div class="day-num">${d}</div>
      <div class="day-events">${chips}${more}</div>
    </div>`;
  }
  const total=firstDow+lastDate;
  const next=total%7===0?0:7-(total%7);
  for(let i=1;i<=next;i++)
    html+=`<div class="cal-day other-month"><div class="day-num">${i}</div></div>`;
  document.getElementById('calDays').innerHTML=html;
}

// 목록
function renderList(){
  const evs=filtered(expand(events)).sort((a,b)=>{
    if(a.date!==b.date) return a.date.localeCompare(b.date);
    return (a.time||'').localeCompare(b.time||'');
  });
  const groups={};
  evs.forEach(ev=>{if(!groups[ev.date])groups[ev.date]=[];groups[ev.date].push(ev);});
  const today=new Date().toISOString().slice(0,10);
  const el=document.getElementById('scheduleList');
  if(!evs.length){el.innerHTML='<div class="empty-msg">📭 일정이 없어요</div>';return;}
  el.innerHTML=Object.entries(groups).map(([date,evs])=>{
    const d=new Date(date+'T00:00:00');
    const dow=['일','월','화','수','목','금','토'][d.getDay()];
    const isToday=date===today;
    return `<div class="date-label">${d.getMonth()+1}월 ${d.getDate()}일 (${dow})${isToday?' · 오늘 ☀️':''}</div>
    ${evs.map(ev=>eventCardHtml(ev)).join('')}`;
  }).join('');
}

// 저장
window.saveEvent = async function(){
  const title=document.getElementById('f_title').value.trim();
  const date=document.getElementById('f_date').value;
  const time=document.getElementById('f_time').value;
  const memo=document.getElementById('f_memo').value.trim();
  const location=document.getElementById('f_loc').value.trim();
  if(!title){showToast('제목을 입력해주세요');return;}
  if(!date){showToast('날짜를 선택해주세요');return;}
  if(!selWho.length){showToast('가족 구성원을 선택해주세요');return;}
  const cl=checks.filter(t=>t.trim());
  const data={title,date,time,memo,location,who:selWho,repeat:selRepeat,checklist:cl,checkDone:{}};
  try{
    if(editingId){
      const existing=events.find(e=>e.id===editingId);
      await updateDoc(doc(db,"events",editingId),{...data,checkDone:existing?.checkDone||{}});
      showToast('✅ 수정됐어요!');
    } else {
      await addDoc(collection(db,"events"),data);
      showToast('✅ 저장됐어요!');
    }
    closeModal('editModal');
  }catch(e){showToast('⚠️ 저장 실패: '+e.message);}
}

window.deleteEvent = async function(){
  if(!editingId||!confirm('이 일정을 삭제할까요?')) return;
  try{await deleteDoc(doc(db,"events",editingId));showToast('🗑️ 삭제됐어요');closeModal('editModal');}
  catch(e){showToast('⚠️ 삭제 실패');}
}

window.toggleCheck = async function(evId,idx){
  const ev=events.find(e=>e.id===evId);
  if(!ev) return;
  const done={...(ev.checkDone||{})};
  done[idx]=!done[idx];
  await updateDoc(doc(db,"events",evId),{checkDone:done});
  // 상세 새로고침
  openDetail(evId, ev.date);
}

window.openDetail = function(id,dateStr){
  const ev=events.find(e=>e.id===id);
  if(!ev) return;
  detailEv={...ev,_viewDate:dateStr};
  const who=Array.isArray(ev.who)?ev.who:[ev.who];
  const done=ev.checkDone||{};
  const rLabel={none:'없음',daily:'매일',weekly:'매주',monthly:'매월',yearly:'매년'};
  document.getElementById('detailContent').innerHTML=`
    <div class="detail-badges">${who.map(w=>`<span class="detail-badge" style="background:${CL[w]||'#eee'};color:${CC[w]||'#333'}">${w}</span>`).join('')}</div>
    <div class="detail-ev-title">${ev.title}</div>
    <div class="d-field"><div class="d-label">📅 날짜</div><div class="d-val">${dateStr}${ev.time?' '+ev.time:''}</div></div>
    ${ev.repeat&&ev.repeat!=='none'?`<div class="d-field"><div class="d-label">🔁 반복</div><div class="d-val">${rLabel[ev.repeat]}</div></div>`:''}
    ${ev.location?`<div class="d-field"><div class="d-label">📍 장소</div><div class="d-val"><a href="https://map.kakao.com/link/search/${encodeURIComponent(ev.location)}" target="_blank" style="color:var(--c영대)">${ev.location} ↗</a></div></div>`:''}
    ${ev.memo?`<div class="d-field"><div class="d-label">📝 메모</div><div class="d-val" style="white-space:pre-wrap">${ev.memo}</div></div>`:''}
    ${ev.checklist&&ev.checklist.length?`<div class="d-field"><div class="d-label">✅ 체크리스트</div><div class="d-checklist">
      ${ev.checklist.map((item,i)=>`<div class="d-check-item ${done[i]?'done':''}" onclick="toggleCheck('${ev.id}',${i})">
        <input type="checkbox" ${done[i]?'checked':''} onclick="event.stopPropagation();toggleCheck('${ev.id}',${i})">
        <span>${item}</span>
      </div>`).join('')}
    </div></div>`:''}
  `;
  openModal('detailModal');
}

window.editFromDetail = function(){
  if(!detailEv) return;
  closeModal('detailModal');
  setTimeout(()=>openAdd(null,detailEv.id),300);
}

// 모달 열기
window.openAdd = function(dateStr,editId){
  editingId=editId||null;
  selWho=[];selRepeat='none';checks=[];
  document.getElementById('f_title').value='';
  document.getElementById('f_date').value=dateStr||new Date().toISOString().slice(0,10);
  document.getElementById('f_time').value='';
  document.getElementById('f_memo').value='';
  document.getElementById('f_loc').value='';
  document.querySelectorAll('.who-btn').forEach(b=>b.classList.remove('sel'));
  document.querySelectorAll('.repeat-btn').forEach(b=>{b.classList.remove('sel');if(b.dataset.r==='none')b.classList.add('sel');});
  document.getElementById('checkWrap').innerHTML='';
  document.getElementById('btnDel').style.display='none';
  document.getElementById('modalTitleTxt').textContent='일정 추가';

  if(editId){
    const ev=events.find(e=>e.id===editId);
    if(ev){
      document.getElementById('modalTitleTxt').textContent='일정 수정';
      document.getElementById('f_title').value=ev.title;
      document.getElementById('f_date').value=ev.date;
      document.getElementById('f_time').value=ev.time||'';
      document.getElementById('f_memo').value=ev.memo||'';
      document.getElementById('f_loc').value=ev.location||'';
      selWho=Array.isArray(ev.who)?[...ev.who]:[ev.who];
      selRepeat=ev.repeat||'none';
      checks=[...(ev.checklist||[])];
      selWho.forEach(w=>{const b=document.querySelector(`.who-btn[data-w="${w}"]`);if(b)b.classList.add('sel');});
      document.querySelectorAll('.repeat-btn').forEach(b=>{b.classList.toggle('sel',b.dataset.r===selRepeat);});
      checks.forEach((c,i)=>addCheckWithVal(c,i));
      document.getElementById('btnDel').style.display='block';
    }
  }
  openModal('editModal');
}

window.setFilter = function(f,btn){
  activeFilter=f;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderAll();
}
window.changeMonth = function(d){
  curMonth.setMonth(curMonth.getMonth()+d);
  renderCal();
}
window.switchTab = function(tab,btn){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('calView').style.display=tab==='cal'?'':'none';
  document.getElementById('listView').style.display=tab==='list'?'':'none';
}
window.toggleWho = function(btn){
  const w=btn.dataset.w;
  if(btn.classList.contains('sel')){btn.classList.remove('sel');selWho=selWho.filter(x=>x!==w);}
  else{btn.classList.add('sel');selWho.push(w);}
}
window.setRepeat = function(btn){
  document.querySelectorAll('.repeat-btn').forEach(b=>b.classList.remove('sel'));
  btn.classList.add('sel');selRepeat=btn.dataset.r;
}
window.addCheck = function(){addCheckWithVal('');}
function addCheckWithVal(val,idx){
  const i=idx!==undefined?idx:checks.length;
  if(idx===undefined) checks.push(val);
  const div=document.createElement('div');
  div.className='check-item';
  div.innerHTML=`<span>·</span><input type="text" value="${val}" placeholder="할 일 입력" oninput="checks[${i}]=this.value"><button class="rm" onclick="this.parentNode.remove();checks.splice(${i},1)">×</button>`;
  document.getElementById('checkWrap').appendChild(div);
}
window.openModal = function(id){document.getElementById(id).classList.add('open');}
window.closeModal = function(id){document.getElementById(id).classList.remove('open');}
window.bgClose = function(e,id){if(e.target===document.getElementById(id))closeModal(id);}
window.showToast = function(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}
</script>
