<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="가족 일정">
<title>가족 일정 🏠</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#f7f5f0; --card:#fff; --border:#e5e0d5; --text:#1a1614; --muted:#8a8078;
  --shadow:0 2px 16px rgba(0,0,0,0.08);
  --c영대:#2563eb; --l영대:#dbeafe;
  --c현희:#e91e8c; --l현희:#fce4f3;
  --c제하:#16a34a; --l제하:#dcfce7;
  --c가율:#ea580c; --l가율:#ffedd5;
  --c가은:#7c3aed; --l가은:#ede9fe;
  --primary:#2563eb;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overscroll-behavior:none;}
a{text-decoration:none;}

/* 헤더 */
.app-header{background:var(--card);border-bottom:1px solid var(--border);padding:14px 16px 10px;position:sticky;top:0;z-index:100;box-shadow:var(--shadow);}
.header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.app-title{font-size:19px;font-weight:900;letter-spacing:-0.5px;}
.header-actions{display:flex;gap:8px;align-items:center;}
.btn-cam{background:var(--bg);border:1.5px solid var(--border);border-radius:50%;width:36px;height:36px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.2s;}
.btn-cam:hover{background:var(--l영대);}
.btn-add-main{background:var(--primary);color:white;border:none;border-radius:50px;padding:7px 16px;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer;}

/* 가족 필터 */
.family-filter{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;}
.family-filter::-webkit-scrollbar{display:none;}
.f-btn{border:2px solid var(--border);border-radius:50px;padding:4px 13px;font-size:12px;font-weight:700;font-family:inherit;cursor:pointer;white-space:nowrap;background:var(--bg);color:var(--muted);transition:all 0.2s;}
.f-btn.all.on{background:var(--text);color:#fff;border-color:var(--text);}
.f-btn[data-f="유영대"].on{background:var(--c영대);color:#fff;border-color:var(--c영대);}
.f-btn[data-f="이현희"].on{background:var(--c현희);color:#fff;border-color:var(--c현희);}
.f-btn[data-f="유제하"].on{background:var(--c제하);color:#fff;border-color:var(--c제하);}
.f-btn[data-f="유가율"].on{background:var(--c가율);color:#fff;border-color:var(--c가율);}
.f-btn[data-f="유가은"].on{background:var(--c가은);color:#fff;border-color:var(--c가은);}

/* 탭 */
.tab-nav{display:flex;background:var(--card);border-bottom:1px solid var(--border);}
.tab-btn{flex:1;padding:11px;border:none;background:transparent;font-family:inherit;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;transition:all 0.2s;}
.tab-btn.on{color:var(--primary);border-bottom-color:var(--primary);}

.main{padding:14px;max-width:760px;margin:0 auto;}

/* 오늘 */
.today-box{background:var(--card);border-radius:14px;padding:14px;margin-bottom:14px;box-shadow:var(--shadow);border-left:4px solid var(--primary);}
.today-hd{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:14px;font-weight:800;}
.today-badge{background:var(--primary);color:#fff;border-radius:50px;padding:2px 10px;font-size:11px;font-weight:700;}
.today-empty{color:var(--muted);font-size:13px;text-align:center;padding:10px 0;}

/* 월 이동 */
.month-nav{display:flex;align-items:center;justify-content:center;gap:20px;margin-bottom:14px;}
.mnav-btn{background:var(--card);border:1px solid var(--border);border-radius:50%;width:34px;height:34px;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);}
.month-lbl{font-size:19px;font-weight:900;letter-spacing:-0.5px;}

/* 달력 */
.cal-grid{background:var(--card);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);}
.cal-wdays{display:grid;grid-template-columns:repeat(7,1fr);background:#f0ede8;}
.cal-wd{text-align:center;padding:8px 0;font-size:11px;font-weight:700;color:var(--muted);}
.cal-wd:first-child{color:#dc2626;} .cal-wd:last-child{color:#2563eb;}
.cal-days{display:grid;grid-template-columns:repeat(7,1fr);}
.cal-day{min-height:68px;border-top:1px solid var(--border);border-right:1px solid var(--border);padding:5px 3px 3px;cursor:pointer;transition:background 0.15s;user-select:none;}
.cal-day:nth-child(7n){border-right:none;}
.cal-day:hover{background:#fafaf8;}
.cal-day.other .dnum{color:#ccc;}
.cal-day.today .dnum{background:var(--primary);color:#fff;border-radius:50%;}
.cal-day.sun .dnum{color:#dc2626;} .cal-day.sat .dnum{color:#2563eb;}
.cal-day.today.sun .dnum,.cal-day.today.sat .dnum{color:#fff;}
.cal-day.copy-target{background:#fffbeb;outline:2px dashed #f59e0b;}
.dnum{font-size:12px;font-weight:700;width:22px;height:22px;display:flex;align-items:center;justify-content:center;margin-bottom:2px;}
.day-evs{display:flex;flex-direction:column;gap:2px;}
.d-chip{border-radius:3px;padding:1px 4px;font-size:10px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;}
.d-more{font-size:9px;color:var(--muted);padding-left:3px;}

/* 이벤트 카드 */
.ev-card{background:var(--card);border-radius:11px;padding:11px 13px;box-shadow:var(--shadow);border-left:4px solid var(--border);cursor:pointer;transition:all 0.2s;display:flex;align-items:flex-start;gap:9px;margin-bottom:5px;user-select:none;}
.ev-card:hover{transform:translateX(2px);}
.ev-card.copied{outline:2px solid #f59e0b;background:#fffbeb;}
.ev-dot{width:9px;height:9px;border-radius:50%;margin-top:4px;flex-shrink:0;}
.ev-info{flex:1;min-width:0;}
.ev-title{font-size:13px;font-weight:700;margin-bottom:2px;}
.ev-meta{display:flex;flex-wrap:wrap;gap:5px;align-items:center;}
.ev-time{font-size:11px;color:var(--muted);}
.who-tag{font-size:10px;font-weight:700;border-radius:50px;padding:1px 7px;}
.ev-body{font-size:12px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.date-lbl{font-size:11px;font-weight:700;color:var(--muted);margin:12px 0 5px 3px;letter-spacing:0.5px;}

/* 검색 */
.search-box{background:var(--card);border-radius:14px;padding:14px;margin-bottom:14px;box-shadow:var(--shadow);}
.search-input-wrap{position:relative;margin-bottom:12px;}
.search-input{width:100%;border:1.5px solid var(--border);border-radius:10px;padding:10px 40px 10px 12px;font-size:14px;font-family:inherit;background:var(--bg);outline:none;transition:border-color 0.2s;}
.search-input:focus{border-color:var(--primary);background:#fff;}
.search-icon{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:16px;color:var(--muted);}
.search-filter{display:flex;gap:6px;flex-wrap:wrap;}
.sf-btn{border:2px solid var(--border);border-radius:50px;padding:4px 12px;font-size:12px;font-weight:700;font-family:inherit;cursor:pointer;background:var(--bg);color:var(--muted);transition:all 0.2s;}
.sf-btn.all.on{background:var(--text);color:#fff;border-color:var(--text);}
.sf-btn[data-sf="유영대"].on{background:var(--c영대);color:#fff;border-color:var(--c영대);}
.sf-btn[data-sf="이현희"].on{background:var(--c현희);color:#fff;border-color:var(--c현희);}
.sf-btn[data-sf="유제하"].on{background:var(--c제하);color:#fff;border-color:var(--c제하);}
.sf-btn[data-sf="유가율"].on{background:var(--c가율);color:#fff;border-color:var(--c가율);}
.sf-btn[data-sf="유가은"].on{background:var(--c가은);color:#fff;border-color:var(--c가은);}
.search-results{margin-top:12px;}
.search-empty{text-align:center;padding:30px;color:var(--muted);font-size:13px;}

/* 모달 */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:200;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity 0.25s;}
.modal-overlay.open{opacity:1;pointer-events:all;}
.modal-sheet{background:var(--card);border-radius:22px 22px 0 0;width:100%;max-width:600px;max-height:92vh;overflow-y:auto;padding:18px 18px 40px;transform:translateY(100%);transition:transform 0.3s cubic-bezier(0.34,1.2,0.64,1);}
.modal-overlay.open .modal-sheet{transform:translateY(0);}
.modal-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 18px;}
.modal-title{font-size:17px;font-weight:900;margin-bottom:18px;display:flex;align-items:center;justify-content:space-between;}
.modal-close{background:var(--bg);border:none;border-radius:50%;width:30px;height:30px;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;}

/* 폼 */
.fg{margin-bottom:14px;}
.fl{font-size:11px;font-weight:700;color:var(--muted);margin-bottom:5px;display:block;letter-spacing:0.5px;}
.fi,.ft{width:100%;border:1.5px solid var(--border);border-radius:9px;padding:10px 11px;font-size:14px;font-family:inherit;background:var(--bg);color:var(--text);outline:none;transition:border-color 0.2s;}
.fi:focus,.ft:focus{border-color:var(--primary);background:#fff;}
.ft{resize:vertical;min-height:90px;}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

/* 구성원 선택 */
.who-sel{display:flex;flex-wrap:wrap;gap:7px;}
.who-btn{border:2px solid var(--border);border-radius:50px;padding:6px 13px;font-size:12px;font-weight:700;font-family:inherit;cursor:pointer;background:transparent;color:var(--muted);transition:all 0.2s;}
.who-btn[data-w="유영대"].on{background:var(--c영대);border-color:var(--c영대);color:#fff;}
.who-btn[data-w="이현희"].on{background:var(--c현희);border-color:var(--c현희);color:#fff;}
.who-btn[data-w="유제하"].on{background:var(--c제하);border-color:var(--c제하);color:#fff;}
.who-btn[data-w="유가율"].on{background:var(--c가율);border-color:var(--c가율);color:#fff;}
.who-btn[data-w="유가은"].on{background:var(--c가은);border-color:var(--c가은);color:#fff;}

.btn-save{background:var(--primary);color:#fff;border:none;border-radius:11px;padding:13px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;width:100%;margin-top:6px;}
.btn-del{background:#fee2e2;color:#dc2626;border:none;border-radius:11px;padding:11px;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer;width:100%;margin-top:8px;}

/* 상세 */
.det-badges{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px;}
.det-badge{border-radius:50px;padding:3px 12px;font-size:12px;font-weight:700;}
.det-title{font-size:20px;font-weight:900;margin-bottom:14px;}
.det-field{margin-bottom:10px;}
.det-lbl{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:0.5px;margin-bottom:3px;}
.det-val{font-size:13px;font-weight:500;}
.btn-edit-det{background:var(--bg);color:var(--text);border:none;border-radius:11px;padding:11px;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer;width:100%;margin-top:10px;}

/* 복사 토스트 */
.copy-bar{position:fixed;bottom:0;left:0;right:0;background:#1a1614;color:#fff;padding:14px 20px;z-index:150;display:flex;align-items:center;justify-content:space-between;transform:translateY(100%);transition:transform 0.3s;font-size:13px;font-weight:600;}
.copy-bar.show{transform:translateY(0);}
.copy-bar-cancel{background:rgba(255,255,255,0.15);border:none;color:#fff;border-radius:8px;padding:6px 14px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;}

/* Gemini 모달 */
.gemini-split{display:flex;flex-direction:column;gap:12px;}
.img-preview-wrap{position:relative;background:#000;border-radius:12px;overflow:hidden;height:240px;display:flex;align-items:center;justify-content:center;}
.img-preview{max-width:100%;max-height:100%;object-fit:contain;touch-action:pinch-zoom;}
.img-placeholder{color:#666;font-size:14px;text-align:center;}
.gemini-result-box{background:var(--bg);border-radius:12px;padding:12px;}
.gemini-status{font-size:13px;color:var(--muted);text-align:center;padding:20px 0;}
.gemini-fields{display:flex;flex-direction:column;gap:8px;}
.gf-item{display:flex;align-items:flex-start;gap:8px;background:#fff;border-radius:8px;padding:8px 10px;}
.gf-lbl{font-size:11px;font-weight:700;color:var(--muted);min-width:36px;margin-top:2px;}
.gf-val{font-size:13px;flex:1;}
.btn-gemini-add{background:var(--primary);color:#fff;border:none;border-radius:11px;padding:12px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;width:100%;margin-top:8px;}
.btn-gemini-file{background:var(--bg);border:1.5px dashed var(--border);border-radius:10px;padding:12px;width:100%;font-size:13px;font-family:inherit;color:var(--muted);cursor:pointer;text-align:center;transition:all 0.2s;}
.btn-gemini-file:hover{border-color:var(--primary);color:var(--primary);}

/* 로딩 */
.loading-overlay{position:fixed;inset:0;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;gap:14px;}
.spinner{width:38px;height:38px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%) translateY(10px);background:#1a1614;color:#fff;border-radius:50px;padding:9px 18px;font-size:12px;font-weight:600;opacity:0;transition:all 0.3s;z-index:999;white-space:nowrap;pointer-events:none;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.empty-msg{text-align:center;padding:36px 20px;color:var(--muted);font-size:13px;}
@media(min-width:600px){.main{padding:18px;}.cal-day{min-height:82px;}.d-chip{font-size:11px;}}
</style>
</head>
<body>

<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <div style="font-size:13px;color:#8a8078;font-weight:600;">가족 일정 불러오는 중...</div>
</div>
<div class="toast" id="toast"></div>

<!-- 복사 모드 바 -->
<div class="copy-bar" id="copyBar">
  <span id="copyBarTxt">📋 일정 복사됨 — 붙여넣을 날짜를 길게 누르세요</span>
  <button class="copy-bar-cancel" onclick="cancelCopy()">취소</button>
</div>

<!-- 헤더 -->
<header class="app-header">
  <div class="header-top">
    <div class="app-title">🏠 가족 일정</div>
    <div class="header-actions">
      <button class="btn-cam" onclick="openGemini()" title="사진으로 일정 추가">📸</button>
      <button class="btn-add-main" onclick="openAdd()">＋ 추가</button>
    </div>
  </div>
  <div class="family-filter">
    <button class="f-btn all on" onclick="setFilter('all',this)">전체</button>
    <button class="f-btn" data-f="유영대" onclick="setFilter('유영대',this)">👨 영대</button>
    <button class="f-btn" data-f="이현희" onclick="setFilter('이현희',this)">👩 현희</button>
    <button class="f-btn" data-f="유제하" onclick="setFilter('유제하',this)">🧑 제하</button>
    <button class="f-btn" data-f="유가율" onclick="setFilter('유가율',this)">👧 가율</button>
    <button class="f-btn" data-f="유가은" onclick="setFilter('유가은',this)">👶 가은</button>
  </div>
</header>

<div class="tab-nav">
  <button class="tab-btn on" onclick="switchTab('cal',this)">📅 달력</button>
  <button class="tab-btn" onclick="switchTab('list',this)">📋 목록</button>
  <button class="tab-btn" onclick="switchTab('search',this)">🔍 검색</button>
</div>

<main class="main">
  <!-- 오늘 -->
  <div class="today-box">
    <div class="today-hd">☀️ 오늘 <span class="today-badge" id="todayBadge"></span></div>
    <div id="todayEvs"><div class="today-empty">오늘 일정 없음 🎉</div></div>
  </div>

  <!-- 달력 탭 -->
  <div id="calTab">
    <div class="month-nav">
      <button class="mnav-btn" onclick="changeMonth(-1)">◀</button>
      <div class="month-lbl" id="monthLbl"></div>
      <button class="mnav-btn" onclick="changeMonth(1)">▶</button>
    </div>
    <div class="cal-grid">
      <div class="cal-wdays">
        <div class="cal-wd">일</div><div class="cal-wd">월</div><div class="cal-wd">화</div>
        <div class="cal-wd">수</div><div class="cal-wd">목</div><div class="cal-wd">금</div><div class="cal-wd">토</div>
      </div>
      <div class="cal-days" id="calDays"></div>
    </div>
  </div>

  <!-- 목록 탭 -->
  <div id="listTab" style="display:none;">
    <div id="schedList"></div>
  </div>

  <!-- 검색 탭 -->
  <div id="searchTab" style="display:none;">
    <div class="search-box">
      <div class="search-input-wrap">
        <input type="text" class="search-input" id="searchInput" placeholder="일정 검색..." oninput="doSearch()">
        <span class="search-icon">🔍</span>
      </div>
      <div class="search-filter">
        <button class="sf-btn all on" onclick="setSFilter('all',this)">전체</button>
        <button class="sf-btn" data-sf="유영대" onclick="setSFilter('유영대',this)">👨 영대</button>
        <button class="sf-btn" data-sf="이현희" onclick="setSFilter('이현희',this)">👩 현희</button>
        <button class="sf-btn" data-sf="유제하" onclick="setSFilter('유제하',this)">🧑 제하</button>
        <button class="sf-btn" data-sf="유가율" onclick="setSFilter('유가율',this)">👧 가율</button>
        <button class="sf-btn" data-sf="유가은" onclick="setSFilter('유가은',this)">👶 가은</button>
      </div>
      <div class="search-results" id="searchResults"></div>
    </div>
  </div>
</main>

<!-- 일정 추가/수정 모달 -->
<div class="modal-overlay" id="editModal" onclick="bgClose(event,'editModal')">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title">
      <span id="editModalTxt">일정 추가</span>
      <button class="modal-close" onclick="closeModal('editModal')">✕</button>
    </div>
    <div class="fg">
      <label class="fl">👥 구성원 *</label>
      <div class="who-sel">
        <button class="who-btn" data-w="유영대" onclick="toggleWho(this)">👨 영대</button>
        <button class="who-btn" data-w="이현희" onclick="toggleWho(this)">👩 현희</button>
        <button class="who-btn" data-w="유제하" onclick="toggleWho(this)">🧑 제하</button>
        <button class="who-btn" data-w="유가율" onclick="toggleWho(this)">👧 가율</button>
        <button class="who-btn" data-w="유가은" onclick="toggleWho(this)">👶 가은</button>
      </div>
    </div>
    <div class="frow">
      <div class="fg">
        <label class="fl">📅 날짜 *</label>
        <input type="date" class="fi" id="f_date">
      </div>
      <div class="fg">
        <label class="fl">⏰ 시간</label>
        <input type="time" class="fi" id="f_time">
      </div>
    </div>
    <div class="fg">
      <label class="fl">📌 제목 *</label>
      <input type="text" class="fi" id="f_title" placeholder="일정 제목">
    </div>
    <div class="fg">
      <label class="fl">📝 내용</label>
      <textarea class="ft" id="f_body" placeholder="내용을 자유롭게 적어주세요..."></textarea>
    </div>
    <button class="btn-save" onclick="saveEvent()">💾 저장</button>
    <button class="btn-del" id="btnDel" style="display:none" onclick="deleteEvent()">🗑️ 삭제</button>
  </div>
</div>

<!-- 상세 모달 -->
<div class="modal-overlay" id="detailModal" onclick="bgClose(event,'detailModal')">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title">

// 반복 펼치기
function expand(evs){
  const res=[], now=new Date();
  const s=new Date(now.getFullYear(),now.getMonth()-3,1);
  const e=new Date(now.getFullYear(),now.getMonth()+9,0);
  evs.forEach(ev=>{
    if(!ev.repeat||ev.repeat==='none'){res.push(ev);return;}
    let d=new Date(ev.date+'T00:00:00'), cnt=0;
    while(d<=e&&cnt<500){
      if(d>=s) res.push({...ev,date:d.toISOString().slice(0,10),_v:true,_oid:ev.id});
      cnt++;
      if(ev.repeat==='daily') d.setDate(d.getDate()+1);
      else if(ev.repeat==='weekly') d.setDate(d.getDate()+7);
      else if(ev.repeat==='monthly') d.setMonth(d.getMonth()+1);
      else if(ev.repeat==='yearly') d.setFullYear(d.getFullYear()+1);
      else break;
    }
  });
  return res;
}

function filtered(evs){
  if(filter==='all') return evs;
  return evs.filter(ev=>{const w=Array.isArray(ev.who)?ev.who:[ev.who];return w.includes(filter);});
}

function renderAll(){renderToday();renderCal();renderList();doSearch();}

// 오늘
function renderToday(){
  const ts=new Date().toISOString().slice(0,10);
  const d=new Date();
  document.getElementById('todayBadge').textContent=`${d.getMonth()+1}월 ${d.getDate()}일`;
  const evs=filtered(expand(events)).filter(ev=>ev.date===ts).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
  const el=document.getElementById('todayEvs');
  if(!evs.length){el.innerHTML='<div class="today-empty">오늘 일정 없음 🎉</div>';return;}
  el.innerHTML=evs.map(ev=>evCardHtml(ev)).join('');
  bindLongPress();
}

function evCardHtml(ev){
  const who=Array.isArray(ev.who)?ev.who:[ev.who];
  const color=CC[who[0]]||'#888', light=CL[who[0]]||'#eee';
  const id=ev._v?ev._oid:ev.id;
  const isCopied=copiedEvent&&copiedEvent.id===id;
  return `<div class="ev-card${isCopied?' copied':''}" style="border-left-color:${color}" data-id="${id}" data-date="${ev.date}" onclick="openDetail('${id}','${ev.date}')">
    <div class="ev-dot" style="background:${color}"></div>
    <div class="ev-info">
      <div class="ev-title">${ev.title}${ev.repeat&&ev.repeat!=='none'?' 🔁':''}</div>
      <div class="ev-meta">
        ${ev.time?`<span class="ev-time">⏰ ${ev.time}</span>`:''}
        ${who.map(w=>`<span class="who-tag" style="background:${CL[w]||'#eee'};color:${CC[w]||'#333'}">${w.slice(1)}</span>`).join('')}
      </div>
      ${ev.body?`<div class="ev-body">📝 ${ev.body}</div>`:''}
    </div>
  </div>`;
}

// 달력
function renderCal(){
  const yr=curMonth.getFullYear(), mo=curMonth.getMonth();
  document.getElementById('monthLbl').textContent=`${yr}년 ${mo+1}월`;
  const today=new Date().toISOString().slice(0,10);
  const expanded=filtered(expand(events));
  const firstDow=new Date(yr,mo,1).getDay();
  const lastDate=new Date(yr,mo+1,0).getDate();
  const prevLast=new Date(yr,mo,0).getDate();
  let html='';
  for(let i=firstDow-1;i>=0;i--)
    html+=`<div class="cal-day other"><div class="dnum">${prevLast-i}</div></div>`;
  for(let d=1;d<=lastDate;d++){
    const ds=`${yr}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dow=new Date(yr,mo,d).getDay();
    let cls='cal-day';
    if(ds===today) cls+=' today';
    if(dow===0) cls+=' sun'; if(dow===6) cls+=' sat';
    const dayEvs=expanded.filter(ev=>ev.date===ds).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
    const chips=dayEvs.slice(0,3).map(ev=>{
      const who=Array.isArray(ev.who)?ev.who:[ev.who];
      const c=CC[who[0]]||'#888', l=CL[who[0]]||'#eee';
      const id=ev._v?ev._oid:ev.id;
      return `<div class="d-chip" style="background:${l};color:${c}" onclick="event.stopPropagation();openDetail('${id}','${ds}')">${ev.time?ev.time.slice(0,5)+' ':''}${ev.title}</div>`;
    }).join('');
    const more=dayEvs.length>3?`<div class="d-more">+${dayEvs.length-3}</div>`:'';
    html+=`<div class="${cls}" data-date="${ds}" onclick="handleDayClick('${ds}')" oncontextmenu="event.preventDefault()">
      <div class="dnum">${d}</div>
      <div class="day-evs">${chips}${more}</div>
    </div>`;
  }
  const total=firstDow+lastDate;
  const next=total%7===0?0:7-(total%7);
  for(let i=1;i<=next;i++)
    html+=`<div class="cal-day other"><div class="dnum">${i}</div></div>`;
  document.getElementById('calDays').innerHTML=html;
  bindCalLongPress();
  bindCardLongPress();
}

// 목록
function renderList(){
  const evs=filtered(expand(events)).sort((a,b)=>{
    if(a.date!==b.date) return a.date.localeCompare(b.date);
    return (a.time||'').localeCompare(b.time||'');
  });
  const groups={};
  evs.forEach(ev=>{if(!groups[ev.date])groups[ev.date]=[];groups[ev.date].push(ev);});
  const today=new Date().toISOString().slice(0,10);
  const el=document.getElementById('schedList');
  if(!evs.length){el.innerHTML='<div class="empty-msg">📭 일정이 없어요</div>';return;}
  el.innerHTML=Object.entries(groups).map(([date,evs])=>{
    const d=new Date(date+'T00:00:00');
    const dow=['일','월','화','수','목','금','토'][d.getDay()];
    return `<div class="date-lbl">${d.getMonth()+1}월 ${d.getDate()}일 (${dow})${date===today?' ☀️':''}</div>
    ${evs.map(ev=>evCardHtml(ev)).join('')}`;
  }).join('');
  bindCardLongPress();
}

window.doSearch=function(){

// 복사 기능 - 카드 길게 누르기
function bindCardLongPress(){
  document.querySelectorAll('.ev-card').forEach(card=>{
    card.addEventListener('touchstart', e=>{
      const id=card.dataset.id;
      if(!id) return;
      longPressTimer=setTimeout(()=>{
        const ev=events.find(e=>e.id===id);
        if(ev){
          copiedEvent={...ev};
          showCopyBar();
          navigator.vibrate&&navigator.vibrate(50);
          showToast('📋 복사됨! 붙여넣을 날짜를 길게 누르세요');
          renderAll();
        }
      },600);
    },{passive:true});
    card.addEventListener('touchend',()=>{clearTimeout(longPressTimer);},{passive:true});
    card.addEventListener('touchmove',()=>{clearTimeout(longPressTimer);},{passive:true});
  });
}

// 달력 날짜 길게 누르기 → 붙여넣기
function bindCalLongPress(){
  document.querySelectorAll('.cal-day:not(.other)').forEach(day=>{
    day.addEventListener('touchstart',e=>{
      const ds=day.dataset.date;
      longPressTimer=setTimeout(()=>{
        if(copiedEvent){
          pasteEvent(ds);
          navigator.vibrate&&navigator.vibrate([50,30,50]);
        } else {
          openAdd(ds);
        }
      },600);
    },{passive:true});
    day.addEventListener('touchend',()=>clearTimeout(longPressTimer),{passive:true});
    day.addEventListener('touchmove',()=>clearTimeout(longPressTimer),{passive:true});
  });
}

function bindLongPress(){bindCardLongPress();}

async function analyzeWithGemini(base64){
  const b64=base64.split(',')[1];
  const mime=base64.split(';')[0].split(':')[1];
  const prompt=`이 사진은 다이어리나 메모입니다. 일정 정보를 추출해서 아래 JSON 형식으로만 답해주세요. 다른 말은 하지 마세요.
{
  "title": "일정 제목",
  "date": "YYYY-MM-DD 형식 (년도 불확실시 2026 사용)",
  "time": "HH:MM 형식 (없으면 빈 문자열)",
  "body": "기타 내용 (장소, 준비물 등)"
}`;
  try{
    const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${GEMINI_KEY}`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({contents:[{parts:[{inline_data:{mime_type:mime,data:b64}},{text:prompt}]}]})
    });
    const data=await res.json();
    const text=data.candidates?.[0]?.content?.parts?.[0]?.text||'';
    const clean=text.replace(/```json|```/g,'').trim();
    const parsed=JSON.parse(clean);
    document.getElementById('geminiStatus').style.display='none';
    document.getElementById('geminiFields').style.display='flex';
    document.getElementById('g_title').value=parsed.title||'';
    document.getElementById('g_date').value=parsed.date||'';
    document.getElementById('g_time').value=parsed.time||'';
    document.getElementById('g_body').value=parsed.body||'';
    document.getElementById('btnGeminiSave').style.display='block';
    showToast('✅ AI가 일정을 읽었어요! 확인 후 등록하세요');
  }catch(e){
    document.getElementById('geminiStatus').textContent='⚠️ 인식 실패. 직접 입력해주세요.';
    document.getElementById('geminiFields').style.display='flex';
    document.getElementById('btnGeminiSave').style.display='block';
    document.getElementById('g_date').value=new Date().toISOString().slice(0,10);
  }
}

window.changeMonth=function(d){curMonth.setMonth(curMonth.getMonth()+d);renderCal();}

window.switchTab=function(tab,btn){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  document.getElementById('calTab').style.display=tab==='cal'?'':'none';
  document.getElementById('listTab').style.display=tab==='list'?'':'none';
  document.getElementById('searchTab').style.display=tab==='search'?'':'none';
  if(tab==='search') document.getElementById('searchInput').focus();
}

window.toggleWho=function(btn){
  const w=btn.dataset.w;
  if(btn.classList.contains('on')){btn.classList.remove('on');selWho=selWho.filter(x=>x!==w);}
  else{btn.classList.add('on');selWho.push(w);}
}

window.openModal=function(id){document.getElementById(id).classList.add('open');}
window.closeModal=function(id){document.getElementById(id).classList.remove('open');}
window.bgClose=function(e,id){if(e.target===document.getElementById(id))closeModal(id);}
window.showToast=function(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}
</script>
</body>
