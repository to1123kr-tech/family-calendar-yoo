<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="가족 일정">
<title>가족 일정</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3b82f6">
<meta name="mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#faf8f5;--card:#fff;--border:#ede8e0;--text:#2d2520;--muted:#9e9488;
  --shadow:0 2px 16px rgba(0,0,0,0.07);--radius:14px;
  --c영대:#3b82f6;--l영대:#eff6ff;
  --c현희:#f472b6;--l현희:#fdf2f8;
  --c제하:#34d399;--l제하:#ecfdf5;
  --c가율:#fb923c;--l가율:#fff7ed;
  --c가은:#a78bfa;--l가은:#f5f3ff;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}

/* 헤더 */
.app-header{background:var(--card);border-bottom:1px solid var(--border);padding:9px 12px;position:sticky;top:0;z-index:100;box-shadow:var(--shadow);}
.header-row{display:flex;align-items:center;gap:6px;}
.app-title{font-size:16px;font-weight:900;letter-spacing:-0.5px;white-space:nowrap;}
.app-version{font-size:9px;color:var(--muted);font-weight:600;background:var(--bg);border-radius:4px;padding:1px 4px;flex-shrink:0;}
.header-actions{display:flex;gap:5px;align-items:center;margin-left:auto;}
.hdr-btn{height:30px;border:none;border-radius:8px;padding:0 9px;font-size:11px;font-weight:700;font-family:inherit;cursor:pointer;display:flex;align-items:center;gap:3px;white-space:nowrap;flex-shrink:0;}
.btn-loc{background:#ede9fe;color:#7c3aed;}
.btn-cam{background:#fff3e0;color:#e65100;}
.btn-add-main{background:var(--c영대);color:white;}

/* 탭 */
.tab-nav{display:flex;background:var(--card);border-bottom:1px solid var(--border);}
.tab-btn{flex:1;padding:11px;border:none;background:transparent;font-family:inherit;font-size:14px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;transition:all 0.2s;}
.tab-btn.on{color:var(--c영대);border-bottom-color:var(--c영대);}

/* 필터 */
.family-filter-wrap{background:var(--card);padding:7px 12px 6px;border-bottom:1px solid var(--border);}
.family-filter{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;}
.family-filter::-webkit-scrollbar{display:none;}
.f-btn{border:2px solid transparent;border-radius:8px;padding:4px 9px;font-size:11px;font-weight:700;font-family:inherit;cursor:pointer;white-space:nowrap;transition:all 0.2s;opacity:0.4;flex-shrink:0;}
.f-btn.all{border-color:#ccc;background:var(--bg);color:var(--muted);}
.f-btn.all.on{opacity:1;background:var(--text);color:#fff;border-color:var(--text);}
.f-btn[data-f="유영대"]{background:var(--l영대);color:var(--c영대);border-color:var(--c영대);}
.f-btn[data-f="이현희"]{background:var(--l현희);color:var(--c현희);border-color:var(--c현희);}
.f-btn[data-f="유제하"]{background:var(--l제하);color:var(--c제하);border-color:var(--c제하);}
.f-btn[data-f="유가율"]{background:var(--l가율);color:var(--c가율);border-color:var(--c가율);}
.f-btn[data-f="유가은"]{background:var(--l가은);color:var(--c가은);border-color:var(--c가은);}
.f-btn[data-f].on,.f-btn.all.on{opacity:1;box-shadow:0 2px 6px rgba(0,0,0,0.12);}
.f-btn.all:not(.on){opacity:0.4;}

.main{padding:12px 14px;max-width:760px;margin:0 auto;}

/* 오늘 */
.today-box{background:var(--card);border-radius:var(--radius);padding:11px 13px;margin-bottom:12px;box-shadow:var(--shadow);border-left:4px solid var(--c영대);}
.today-hd{display:flex;align-items:center;gap:7px;margin-bottom:7px;font-size:13px;font-weight:800;}
.today-badge{background:var(--c영대);color:#fff;border-radius:20px;padding:2px 9px;font-size:11px;font-weight:700;}
.today-empty{color:var(--muted);font-size:12px;text-align:center;padding:7px 0;}

/* 월 이동 */
.month-nav{display:flex;align-items:center;justify-content:center;gap:18px;margin-bottom:12px;}
.mnav-btn{background:var(--card);border:1.5px solid var(--border);border-radius:50%;width:32px;height:32px;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);}
.month-lbl{font-size:19px;font-weight:900;letter-spacing:-0.5px;}

/* 달력 */
.cal-grid{background:var(--card);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);}
.cal-wdays{display:grid;grid-template-columns:repeat(7,1fr);background:#f5f2ed;}
.cal-wd{text-align:center;padding:7px 0;font-size:12px;font-weight:700;color:var(--muted);}
.cal-wd:first-child{color:#f87171;}.cal-wd:last-child{color:#60a5fa;}
.cal-days{display:grid;grid-template-columns:repeat(7,1fr);}
.cal-day{min-height:72px;border-top:1px solid var(--border);border-right:1px solid var(--border);padding:4px 2px 2px;cursor:pointer;transition:background 0.15s;user-select:none;position:relative;overflow:hidden;}
.cal-day:nth-child(7n){border-right:none;}
.cal-day.other{opacity:0.4;pointer-events:none;}
.cal-day.today .dnum{background:var(--c영대);color:#fff;border-radius:50%;}
.cal-day.sun .dnum{color:#f87171;}.cal-day.sat .dnum{color:#60a5fa;}
.cal-day.today.sun .dnum,.cal-day.today.sat .dnum{color:#fff;}
.cal-day.holiday-day{background:#fff8f8;}
/* 여러날짜 선택 모드 */
.cal-day.paste-selected{background:#dbeafe;outline:2px solid var(--c영대);}
.cal-day.paste-mode:not(.other):hover{background:#eff6ff;}
.dnum{font-size:12px;font-weight:700;width:22px;height:22px;display:flex;align-items:center;justify-content:center;margin:0 auto 1px;}
.holiday-name{font-size:8.5px;color:#ef4444;font-weight:700;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:1px;line-height:1.3;padding:0 1px;}
.day-evs{display:flex;flex-direction:column;gap:1px;}
.d-chip{border-radius:3px;padding:1px 3px;font-size:9.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.4;}
.d-more{font-size:9px;color:var(--muted);padding-left:2px;}

/* 붙여넣기 모드 배너 */
.paste-banner{position:fixed;top:0;left:0;right:0;background:var(--c영대);color:#fff;padding:10px 14px;z-index:300;display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:700;transform:translateY(-100%);transition:transform 0.3s;}
.paste-banner.show{transform:translateY(0);}
.paste-banner-btns{display:flex;gap:8px;}
.paste-done{background:#fff;color:var(--c영대);border:none;border-radius:8px;padding:5px 14px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;}
.paste-cancel-btn{background:rgba(255,255,255,0.2);border:none;color:#fff;border-radius:8px;padding:5px 12px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;}

/* 이벤트 카드 */
.ev-card{background:var(--card);border-radius:11px;padding:10px 12px;box-shadow:var(--shadow);border-left:4px solid var(--border);cursor:pointer;transition:all 0.2s;display:flex;align-items:flex-start;gap:8px;margin-bottom:6px;user-select:none;position:relative;}
.ev-card.long-pressing{transform:scale(0.97);opacity:0.8;}
.ev-dot{width:8px;height:8px;border-radius:50%;margin-top:4px;flex-shrink:0;}
.ev-info{flex:1;min-width:0;}
.ev-title{font-size:13px;font-weight:700;margin-bottom:3px;}
.ev-meta{display:flex;flex-wrap:wrap;gap:4px;align-items:center;}
.ev-time{font-size:11px;color:var(--muted);}
.who-tag{font-size:10px;font-weight:700;border-radius:6px;padding:1px 7px;}
.ev-body{font-size:11px;color:var(--muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.ev-date-lbl{font-size:11px;color:var(--muted);margin-top:2px;font-weight:600;}
.date-lbl{font-size:11px;font-weight:700;color:var(--muted);margin:12px 0 5px 2px;}

/* 검색 */
.search-area{display:flex;flex-direction:column;gap:10px;}
.search-filter{display:flex;gap:5px;flex-wrap:wrap;}
.sf-btn{border:2px solid transparent;border-radius:8px;padding:4px 9px;font-size:11px;font-weight:700;font-family:inherit;cursor:pointer;white-space:nowrap;transition:all 0.2s;opacity:0.4;}
.sf-btn.all{border-color:#ccc;background:var(--bg);color:var(--muted);}
.sf-btn.all.on{opacity:1;background:var(--text);color:#fff;border-color:var(--text);}
.sf-btn[data-sf="유영대"]{background:var(--l영대);color:var(--c영대);border-color:var(--c영대);}
.sf-btn[data-sf="이현희"]{background:var(--l현희);color:var(--c현희);border-color:var(--c현희);}
.sf-btn[data-sf="유제하"]{background:var(--l제하);color:var(--c제하);border-color:var(--c제하);}
.sf-btn[data-sf="유가율"]{background:var(--l가율);color:var(--c가율);border-color:var(--c가율);}
.sf-btn[data-sf="유가은"]{background:var(--l가은);color:var(--c가은);border-color:var(--c가은);}
.sf-btn[data-sf].on,.sf-btn.all.on{opacity:1;box-shadow:0 2px 6px rgba(0,0,0,0.12);}
.sf-btn.all:not(.on){opacity:0.4;}
.search-sort{display:flex;gap:5px;align-items:center;}
.sort-btn{border:1.5px solid var(--border);border-radius:7px;padding:3px 9px;font-size:11px;font-weight:700;font-family:inherit;cursor:pointer;background:var(--bg);color:var(--muted);transition:all 0.2s;}
.sort-btn.on{background:var(--text);color:#fff;border-color:var(--text);}
.search-input{width:100%;border:1.5px solid var(--border);border-radius:12px;padding:10px 14px;font-size:13px;font-family:inherit;background:var(--card);outline:none;transition:border-color 0.2s;box-shadow:var(--shadow);}
.search-input:focus{border-color:var(--c영대);}
.search-empty{text-align:center;padding:28px;color:var(--muted);font-size:13px;}

/* 모달 공통 */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:200;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity 0.25s;}
.modal-overlay.open{opacity:1;pointer-events:all;}
.modal-sheet{background:var(--card);border-radius:22px 22px 0 0;width:100%;max-width:600px;max-height:92vh;overflow-y:auto;padding:16px 16px 44px;transform:translateY(100%);transition:transform 0.32s cubic-bezier(0.34,1.2,0.64,1);}
.modal-overlay.open .modal-sheet{transform:translateY(0);}
.modal-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 16px;}
.modal-title{font-size:17px;font-weight:900;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;}
.modal-close{background:var(--bg);border:none;border-radius:50%;width:28px;height:28px;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--muted);}

/* 복사 확인 모달 */
.confirm-modal{background:var(--card);border-radius:18px;width:calc(100% - 40px);max-width:340px;padding:22px 20px;transform:scale(0.9);transition:transform 0.25s;}
.modal-overlay.open .confirm-modal{transform:scale(1);}
.confirm-title{font-size:16px;font-weight:900;margin-bottom:8px;}
.confirm-desc{font-size:13px;color:var(--muted);margin-bottom:20px;line-height:1.6;}
.confirm-ev-preview{background:var(--bg);border-radius:10px;padding:10px 12px;margin-bottom:18px;border-left:4px solid var(--c영대);}
.confirm-btns{display:flex;gap:8px;}
.confirm-btn{flex:1;padding:12px;border:none;border-radius:11px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;}
.confirm-ok{background:var(--c영대);color:#fff;}
.confirm-cancel{background:var(--bg);color:var(--text);}

/* 붙여넣기 옵션 모달 */
.paste-opt-btns{display:flex;flex-direction:column;gap:10px;margin-top:4px;}
.paste-opt-btn{padding:14px;border:2px solid var(--border);border-radius:12px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;background:var(--card);color:var(--text);text-align:left;transition:all 0.2s;}
.paste-opt-btn:hover{border-color:var(--c영대);color:var(--c영대);}
.paste-opt-btn small{display:block;font-size:11px;font-weight:400;color:var(--muted);margin-top:3px;}

/* 날짜 클릭 팝업 */
.day-modal-empty{color:var(--muted);font-size:13px;text-align:center;padding:16px 0;}
.btn-day-add{background:var(--c영대);color:#fff;border:none;border-radius:11px;padding:12px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;width:100%;margin-top:10px;}

/* 폼 */
.fg{margin-bottom:13px;}
.fl{font-size:11px;font-weight:700;color:var(--muted);margin-bottom:5px;display:block;letter-spacing:0.3px;}
.fi,.ft{width:100%;border:1.5px solid var(--border);border-radius:10px;padding:9px 11px;font-size:13px;font-family:inherit;background:var(--bg);color:var(--text);outline:none;transition:border-color 0.2s;}
.fi:focus,.ft:focus{border-color:var(--c영대);background:#fff;}
.ft{resize:vertical;min-height:85px;}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.who-sel{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;}
.who-sel::-webkit-scrollbar{display:none;}
.who-btn{border:2px solid transparent;border-radius:8px;padding:6px 11px;font-size:12px;font-weight:700;font-family:inherit;cursor:pointer;transition:all 0.2s;opacity:0.45;white-space:nowrap;flex-shrink:0;}
.who-btn[data-w="유영대"]{background:var(--l영대);color:var(--c영대);border-color:var(--c영대);}
.who-btn[data-w="이현희"]{background:var(--l현희);color:var(--c현희);border-color:var(--c현희);}
.who-btn[data-w="유제하"]{background:var(--l제하);color:var(--c제하);border-color:var(--c제하);}
.who-btn[data-w="유가율"]{background:var(--l가율);color:var(--c가율);border-color:var(--c가율);}
.who-btn[data-w="유가은"]{background:var(--l가은);color:var(--c가은);border-color:var(--c가은);}
.who-btn.on{opacity:1;box-shadow:0 2px 6px rgba(0,0,0,0.15);}
.btn-save{background:var(--c영대);color:#fff;border:none;border-radius:12px;padding:13px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;width:100%;margin-top:6px;}
.btn-del{background:#fef2f2;color:#ef4444;border:none;border-radius:12px;padding:11px;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer;width:100%;margin-top:8px;}

/* 상세 */
.det-badges{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px;}
.det-badge{border-radius:8px;padding:3px 11px;font-size:12px;font-weight:700;}
.det-title{font-size:20px;font-weight:900;margin-bottom:13px;}
.det-field{margin-bottom:9px;}
.det-lbl{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:0.3px;margin-bottom:3px;}
.det-val{font-size:13px;font-weight:500;}
.btn-edit-det{background:var(--bg);color:var(--text);border:1.5px solid var(--border);border-radius:12px;padding:11px;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer;width:100%;margin-top:10px;}

/* Gemini */
.img-preview-wrap{background:#111;border-radius:12px;overflow:hidden;height:220px;display:flex;align-items:center;justify-content:center;}
.img-preview{max-width:100%;max-height:100%;object-fit:contain;touch-action:pinch-zoom;}
.img-placeholder{color:#666;font-size:13px;text-align:center;line-height:2;}
.gemini-result-box{background:var(--bg);border-radius:12px;padding:12px;margin-top:10px;}
.gemini-status{font-size:12px;color:var(--muted);text-align:center;padding:16px 0;}
.btn-gemini-file{background:var(--card);border:1.5px dashed var(--border);border-radius:10px;padding:10px;font-size:12px;font-family:inherit;color:var(--muted);cursor:pointer;text-align:center;flex:1;}
.btn-gemini-add{background:var(--c영대);color:#fff;border:none;border-radius:12px;padding:12px;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer;width:100%;margin-top:8px;}

/* 공통 */
.loading-overlay{position:fixed;inset:0;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;gap:14px;}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--c영대);border-radius:50%;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.toast{position:fixed;bottom:65px;left:50%;transform:translateX(-50%) translateY(10px);background:#2d2520;color:#fff;border-radius:20px;padding:8px 16px;font-size:12px;font-weight:600;opacity:0;transition:all 0.3s;z-index:999;white-space:nowrap;pointer-events:none;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.empty-msg{text-align:center;padding:36px 16px;color:var(--muted);font-size:13px;}
@media(min-width:600px){.main{padding:16px;}.cal-day{min-height:82px;}}
</style>
</head>
<body>

<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <div style="font-size:13px;color:#9e9488;font-weight:600;">가족 일정 불러오는 중... 🏠</div>
</div>
<div class="toast" id="toast"></div>

<!-- 붙여넣기 모드 배너 -->
<div class="paste-banner" id="pasteBanner">
  <span id="pasteBannerTxt">📋 날짜를 길게 눌러 붙여넣기</span>
  <div class="paste-banner-btns">
    <button class="paste-done" id="pasteDoneBtn" style="display:none" onclick="completePaste()">✅ 완료</button>
    <button class="paste-cancel-btn" onclick="cancelCopy()">취소</button>
  </div>
</div>

<!-- 헤더 -->
<header class="app-header">
  <div class="header-row">
    <div class="app-title">🏠 가족 일정</div>
    <span class="app-version">v3.2</span>
    <div class="header-actions">
      <button class="hdr-btn btn-loc" onclick="window.open('https://family-tracker-yoo.web.app','_blank')">📍 위치조회</button>
      <button class="hdr-btn btn-cam" onclick="openGemini()">📸 사진</button>
      <button class="hdr-btn btn-add-main" onclick="openAdd()">＋ 일정추가</button>
    </div>
  </div>
</header>

<div class="tab-nav">
  <button class="tab-btn on" onclick="switchTab('cal',this)">📅 달력</button>
  <button class="tab-btn" onclick="switchTab('list',this)">📋 목록</button>
  <button class="tab-btn" onclick="switchTab('search',this)">🔍 검색</button>
</div>

<div class="family-filter-wrap" id="filterWrap">
  <div class="family-filter">
    <button class="f-btn all on" onclick="setFilter('all',this)">전체</button>
    <button class="f-btn" data-f="유영대" onclick="setFilter('유영대',this)">👨 영대</button>
    <button class="f-btn" data-f="이현희" onclick="setFilter('이현희',this)">👩 현희</button>
    <button class="f-btn" data-f="유제하" onclick="setFilter('유제하',this)">🧑 제하</button>
    <button class="f-btn" data-f="유가율" onclick="setFilter('유가율',this)">👧 가율</button>
    <button class="f-btn" data-f="유가은" onclick="setFilter('유가은',this)">👶 가은</button>
  </div>
</div>

<main class="main">
  <div class="today-box" id="todayBox">
    <div class="today-hd">☀️ 오늘 <span class="today-badge" id="todayBadge"></span></div>
    <div id="todayEvs"><div class="today-empty">오늘 일정 없음 🎉</div></div>
  </div>

  <div id="calTab">
    <div class="month-nav">
      <button class="mnav-btn" onclick="changeMonth(-1)">◀</button>
      <div class="month-lbl" id="monthLbl"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

const FB={apiKey:"AIzaSyBk1bMw7zutUQXxCWs_fY8Jh5XAYd-M7Zs",authDomain:"family-calendar-yoo.firebaseapp.com",projectId:"family-calendar-yoo",storageBucket:"family-calendar-yoo.firebasestorage.app",messagingSenderId:"29463720385",appId:"1:29463720385:web:995328e6ee09e81daaff40"};
const GEMINI_KEY="AIzaSyDaWqZCQfYSmgLPK52vOyd7RtB0x0s6sA8";
const HOLIDAY_KEY="09b819905e0a70316749fb91c03a216633ad3e75196a6aa25e6a9f273d9116f8";
const app=initializeApp(FB),db=getFirestore(app);
const CC={'유영대':'#3b82f6','이현희':'#f472b6','유제하':'#34d399','유가율':'#fb923c','유가은':'#a78bfa'};
const CL={'유영대':'#eff6ff','이현희':'#fdf2f8','유제하':'#ecfdf5','유가율':'#fff7ed','유가은':'#f5f3ff'};

let events=[],curMonth=new Date(),filters=[],editId=null;
let selWho=[],gSelWho=[],sFilter='all',detailEv=null;
let longPressTimer=null;
const holidayCache={};

// 복사 관련 상태
let copiedEvent=null;        // 복사된 일정
let pendingCopyEv=null;      // 확인 대기 중
let pasteTargetDate=null;    // 붙여넣기 대상 날짜 (단일)
let multiPasteMode=false;    // 여러 날짜 모드
let multiPasteDates=new Set(); // 선택된 날짜들
let searchSort='date-desc';

// 뒤로가기 종료 확인
window.addEventListener('popstate',()=>{
  if(confirm('앱을 종료하시겠습니까?')){window.close();}

// 공휴일 API
async function getHolidays(year){
  if(holidayCache[year]) return holidayCache[year];
  const map={};
  try{
    await Promise.all(['01','02','03','04','05','06','07','08','09','10','11','12'].map(async mo=>{
      const url=`https://apis.data.go.kr/B090041/openapi/service/SpcdeInfoService/getRestDeInfo?solYear=${year}&solMonth=${mo}&ServiceKey=${HOLIDAY_KEY}&numOfRows=30&_type=json`;
      const res=await fetch(url);
      const data=await res.json();
      const items=data?.response?.body?.items?.item;
      if(!items) return;
      (Array.isArray(items)?items:[items]).forEach(item=>{
        const ds=String(item.locdate);
        const key=`${ds.slice(0,4)}-${ds.slice(4,6)}-${ds.slice(6,8)}`;
        if(!map[key]) map[key]=item.dateName;
      });
    }));
  }catch(e){console.warn('공휴일 오류',e);}
  holidayCache[year]=map;
  return map;
}
async function preloadHolidays(year){
  await Promise.all([getHolidays(year-1),getHolidays(year),getHolidays(year+1)]);
}
preloadHolidays(new Date().getFullYear());

// Firebase
const q=query(collection(db,"events"),orderBy("date","asc"));
onSnapshot(q,snap=>{
  events=[];
  snap.forEach(d=>events.push({id:d.id,...d.data()}));
  renderAll();
  document.getElementById('loadingOverlay').style.display='none';
},err=>{
  document.getElementById('loadingOverlay').style.display='none';
  showToast('⚠️ 연결 실패');
});

function expand(evs){
  const res=[],now=new Date();
  const s=new Date(now.getFullYear(),now.getMonth()-3,1);
  const e=new Date(now.getFullYear(),now.getMonth()+9,0);
  evs.forEach(ev=>{
    if(!ev.repeat||ev.repeat==='none'){res.push(ev);return;}
    let d=new Date(ev.date+'T00:00:00'),cnt=0;
    while(d<=e&&cnt<500){
      if(d>=s) res.push({...ev,date:d.toISOString().slice(0,10),_v:true,_oid:ev.id});
      cnt++;
      if(ev.repeat==='daily') d.setDate(d.getDate()+1);
      else if(ev.repeat==='weekly') d.setDate(d.getDate()+7);
      else if(ev.repeat==='monthly') d.setMonth(d.getMonth()+1);
      else if(ev.repeat==='yearly') d.setFullYear(d.getFullYear()+1);
      else break;
    }
  });
  return res;
}
function applyFilter(evs){
  if(!filters.length) return evs;
  return evs.filter(ev=>{const w=Array.isArray(ev.who)?ev.who:[ev.who];return filters.some(f=>w.includes(f));});
}
function renderAll(){renderToday();renderCal();renderList();doSearch();}

// 오늘
function renderToday(){
  const ts=new Date().toISOString().slice(0,10);
  const d=new Date();
  document.getElementById('todayBadge').textContent=`${d.getMonth()+1}월 ${d.getDate()}일`;
  const evs=applyFilter(expand(events)).filter(ev=>ev.date===ts).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
  const el=document.getElementById('todayEvs');
  if(!evs.length){el.innerHTML='<div class="today-empty">오늘 일정 없음 🎉</div>';return;}
  el.innerHTML=evs.map(ev=>evCardHtml(ev,false)).join('');
  bindCardLongPress();
}

function evCardHtml(ev,showDate=false){
  const who=Array.isArray(ev.who)?ev.who:[ev.who];
  const color=CC[who[0]]||'#888';
  const id=ev._v?ev._oid:ev.id;
  return `<div class="ev-card" style="border-left-color:${color}" data-id="${id}" data-date="${ev.date}" onclick="openDetail('${id}','${ev.date}')">
    <div class="ev-dot" style="background:${color}"></div>
    <div class="ev-info">
      <div class="ev-title">${ev.title}</div>
      <div class="ev-meta">
        ${ev.time&&!showDate?`<span class="ev-time">⏰ ${ev.time}</span>`:''}
        ${who.map(w=>`<span class="who-tag" style="background:${CL[w]||'#eee'};color:${CC[w]||'#333'}">${w.slice(1)}</span>`).join('')}
      </div>
      ${ev.body?`<div class="ev-body">📝 ${ev.body}</div>`:''}
      ${showDate?`<div class="ev-date-lbl">📅 ${ev.date}${ev.time?' · '+ev.time:''}</div>`:''}
    </div>
  </div>`;
}

// 달력
async function renderCal(){
  const yr=curMonth.getFullYear(),mo=curMonth.getMonth();
  document.getElementById('monthLbl').textContent=`${yr}년 ${mo+1}월`;
  const today=new Date().toISOString().slice(0,10);
  const expanded=applyFilter(expand(events));
  const holidays=await getHolidays(yr);
  const firstDow=new Date(yr,mo,1).getDay();
  const lastDate=new Date(yr,mo+1,0).getDate();
  const prevLast=new Date(yr,mo,0).getDate();
  let html='';
  for(let i=firstDow-1;i>=0;i--)
    html+=`<div class="cal-day other"><div class="dnum">${prevLast-i}</div></div>`;
  for(let d=1;d<=lastDate;d++){
    const ds=`${yr}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dow=new Date(yr,mo,d).getDay();
    const hName=holidays[ds]||'';
    let cls='cal-day';
    if(ds===today) cls+=' today';
    if(dow===0) cls+=' sun'; if(dow===6) cls+=' sat';
    if(hName) cls+=' holiday-day';
    if(multiPasteMode) cls+=' paste-mode';
    if(multiPasteDates.has(ds)) cls+=' paste-selected';
    const filteredEvs=expanded.filter(ev=>ev.date===ds).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
    const chips=filteredEvs.slice(0,2).map(ev=>{
      const who=Array.isArray(ev.who)?ev.who:[ev.who];
      return `<div class="d-chip" style="background:${CL[who[0]]||'#eee'};color:${CC[who[0]]||'#888'}">${ev.time?ev.time.slice(0,5)+' ':''}${ev.title}</div>`;
    }).join('');
    const more=filteredEvs.length>2?`<div class="d-more">+${filteredEvs.length-2}</div>`:'';
    const dnumStyle=(hName&&dow!==0&&dow!==6)?'style="color:#ef4444"':'';
    html+=`<div class="${cls}" data-date="${ds}" onclick="handleDayTap('${ds}')" oncontextmenu="event.preventDefault()">
      <div class="dnum" ${dnumStyle}>${d}</div>
      ${hName?`<div class="holiday-name">${hName}</div>`:''}
      <div class="day-evs">${chips}${more}</div>
    </div>`;
  }
  const total=firstDow+lastDate;
  const next=total%7===0?0:7-(total%7);
  for(let i=1;i<=next;i++)
    html+=`<div class="cal-day other"><div class="dnum">${i}</div></div>`;
  document.getElementById('calDays').innerHTML=html;
  bindCalLongPress();
  bindCardLongPress();
}

// 날짜 탭
window.handleDayTap=function(ds){
  if(multiPasteMode){
    // 여러날짜 선택 모드: 탭으로 선택/해제
    if(multiPasteDates.has(ds)) multiPasteDates.delete(ds);
    else multiPasteDates.add(ds);
    const cnt=multiPasteDates.size;
    document.getElementById('pasteBannerTxt').textContent=cnt>0?`📋 ${cnt}개 날짜 선택됨 — 완료를 누르세요`:'📋 날짜를 탭해서 선택하세요';
    document.getElementById('pasteDoneBtn').style.display=cnt>0?'':'none';
    renderCal();
    return;
  }
  if(copiedEvent) return; // 붙여넣기 대기 중엔 아무것도 안함 (길게눌러야)
  openDayModal(ds);
}

// 날짜 길게 누르기 → 붙여넣기 옵션
function bindCalLongPress(){
  document.querySelectorAll('.cal-day:not(.other)').forEach(day=>{
    day.addEventListener('touchstart',e=>{
      const ds=day.dataset.date;
      longPressTimer=setTimeout(()=>{
        if(copiedEvent||multiPasteMode){
          navigator.vibrate&&navigator.vibrate(60);
          pasteTargetDate=ds;
          const d=new Date(ds+'T00:00:00');
          const dow=['일','월','화','수','목','금','토'][d.getDay()];
          document.getElementById('pasteOptTitle').textContent=`📋 ${d.getMonth()+1}월 ${d.getDate()}일 (${dow})에 붙여넣기`;
          openModal('pasteOptModal');
        }
      },600);
    },{passive:true});
    day.addEventListener('touchend',()=>clearTimeout(longPressTimer),{passive:true});
    day.addEventListener('touchmove',()=>clearTimeout(longPressTimer),{passive:true});
  });
}

// 여기만 추가
window.pasteHere=async function(){
  closeModal('pasteOptModal');
  if(!copiedEvent||!pasteTargetDate) return;
  await doPaste([pasteTargetDate]);
}

// 여러 날짜 모드 시작
window.startMultiPaste=function(){
  closeModal('pasteOptModal');
  multiPasteMode=true;
  multiPasteDates=new Set();
  if(pasteTargetDate) multiPasteDates.add(pasteTargetDate);
  document.getElementById('pasteBannerTxt').textContent=`📋 날짜를 탭해서 선택하세요`;
  document.getElementById('pasteDoneBtn').style.display='none';
  document.getElementById('pasteBanner').classList.add('show');
  renderCal();
}

// 여러 날짜 완료
window.completePaste=async function(){
  if(multiPasteDates.size===0){showToast('날짜를 선택해주세요');return;}
  await doPaste([...multiPasteDates]);
}

async function doPaste(dates){
  if(!copiedEvent) return;
  try{
    await Promise.all(dates.map(ds=>{
      const data={...copiedEvent,date:ds};
      delete data.id;delete data._v;delete data._oid;
      return addDoc(collection(db,"events"),data);
    }));
    showToast(`✅ ${dates.length}개 날짜에 추가됐어요!`);
    cancelCopy();
  }catch(e){showToast('⚠️ 붙여넣기 실패');}
}

window.cancelCopy=function(){
  copiedEvent=null;multiPasteMode=false;multiPasteDates=new Set();pasteTargetDate=null;
  document.getElementById('pasteBanner').classList.remove('show');
  renderCal();
}

// 일정 길게 누르기 → 복사 확인
function bindCardLongPress(){
  document.querySelectorAll('.ev-card').forEach(card=>{
    card.addEventListener('touchstart',e=>{
      const id=card.dataset.id; if(!id) return;
      longPressTimer=setTimeout(()=>{
        const ev=events.find(e=>e.id===id);
        if(!ev) return;
        navigator.vibrate&&navigator.vibrate(60);
        card.classList.add('long-pressing');
        setTimeout(()=>card.classList.remove('long-pressing'),300);
        pendingCopyEv=ev;
        // 미리보기
        const who=Array.isArray(ev.who)?ev.who:[ev.who];
        const color=CC[who[0]]||'#888';
        document.getElementById('copyPreview').style.borderLeftColor=color;
        document.getElementById('copyPreview').innerHTML=`<div style="font-weight:700;font-size:13px">${ev.title}</div><div style="font-size:11px;color:#9e9488;margin-top:3px">${ev.date}${ev.time?' · '+ev.time:''} · ${who.map(w=>w.slice(1)).join(', ')}</div>`;
        openModal('copyConfirmModal');
      },600);
    },{passive:true});
    card.addEventListener('touchend',()=>clearTimeout(longPressTimer),{passive:true});
    card.addEventListener('touchmove',()=>clearTimeout(longPressTimer),{passive:true});
  });
}

// 날짜 팝업
window.openDayModal=function(ds){
  const d=new Date(ds+'T00:00:00');
  const dow=['일','월','화','수','목','금','토'][d.getDay()];
  document.getElementById('dayModalTitle').textContent=`📅 ${d.getMonth()+1}월 ${d.getDate()}일 (${dow})`;
  const dayEvs=expand(events).filter(ev=>ev.date===ds).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
  const el=document.getElementById('dayModalEvs');
  el.innerHTML=dayEvs.length?dayEvs.map(ev=>evCardHtml(ev,false)).join(''):'<div class="day-modal-empty">이 날 일정이 없어요 😊</div>';
  document.getElementById('btnDayAdd').onclick=()=>{closeModal('dayModal');openAdd(ds);};
  openModal('dayModal');
  bindCardLongPress();
}

// 목록
function renderList(){
  const evs=applyFilter(expand(events)).sort((a,b)=>{
    if(a.date!==b.date) return b.date.localeCompare(a.date);
    return (b.time||'').localeCompare(a.time||'');
  });
  const groups={};
  evs.forEach(ev=>{if(!groups[ev.date])groups[ev.date]=[];groups[ev.date].push(ev);});
  const today=new Date().toISOString().slice(0,10);
  const el=document.getElementById('schedList');
  if(!evs.length){el.innerHTML='<div class="empty-msg">📭 일정이 없어요</div>';return;}
  el.innerHTML=Object.entries(groups).map(([date,evs])=>{
    const d=new Date(date+'T00:00:00');
    const dow=['일','월','화','수','목','금','토'][d.getDay()];
    return `<div class="date-lbl">${d.getMonth()+1}월 ${d.getDate()}일 (${dow})${date===today?' ☀️':''}</div>${evs.map(ev=>evCardHtml(ev,false)).join('')}`;
  }).join('');
  bindCardLongPress();
}

// 검색 (이름 정렬 포함)
window.doSearch=function(){
  const q=document.getElementById('searchInput').value.trim().toLowerCase();
  const el=document.getElementById('searchResults');
  if(!q&&sFilter==='all'){el.innerHTML='';return;}
  let evs=expand(events);
  if(sFilter!=='all') evs=evs.filter(ev=>{const w=Array.isArray(ev.who)?ev.who:[ev.who];return w.includes(sFilter);});
  if(q) evs=evs.filter(ev=>(ev.title||'').toLowerCase().includes(q)||(ev.body||'').toLowerCase().includes(q));
  // 정렬
  const ORDER=['유영대','이현희','유제하','유가율','유가은'];
  if(searchSort==='date-desc') evs.sort((a,b)=>b.date.localeCompare(a.date));
  else if(searchSort==='date-asc') evs.sort((a,b)=>a.date.localeCompare(b.date));
  else if(searchSort==='name') evs.sort((a,b)=>{
    const wa=Array.isArray(a.who)?a.who[0]:a.who;
    const wb=Array.isArray(b.who)?b.who[0]:b.who;
    return ORDER.indexOf(wa)-ORDER.indexOf(wb);
  });
  if(!evs.length){el.innerHTML='<div class="search-empty">검색 결과가 없어요 🔍</div>';return;}
  el.innerHTML=evs.map(ev=>evCardHtml(ev,true)).join('');
  bindCardLongPress();
}
window.setSFilter=function(f,btn){
  sFilter=f;
  document.querySelectorAll('.sf-btn').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');doSearch();
}
window.setSort=function(btn){
  searchSort=btn.dataset.sort;
  document.querySelectorAll('.sort-btn').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');doSearch();
}

// 필터
window.setFilter=function(f,btn){
  if(f==='all'){
    filters=[];
    document.querySelectorAll('.f-btn').forEach(b=>b.classList.remove('on'));
    btn.classList.add('on');
  } else {
    document.querySelector('.f-btn.all').classList.remove('on');
    if(btn.classList.contains('on')){btn.classList.remove('on');filters=filters.filter(x=>x!==f);if(!filters.length) document.querySelector('.f-btn.all').classList.add('on');}
    else{btn.classList.add('on');filters.push(f);}
  }
  renderAll();
}

// CRUD
window.saveEvent=async function(){
  const title=document.getElementById('f_title').value.trim();
  const date=document.getElementById('f_date').value;
  const time=document.getElementById('f_time').value;
  const body=document.getElementById('f_body').value.trim();
  if(!title){showToast('제목을 입력해주세요');return;}
  if(!date){showToast('날짜를 선택해주세요');return;}
  if(!selWho.length){showToast('구성원을 선택해주세요');return;}
  const data={title,date,time,body,who:selWho,repeat:'none'};
  try{
    if(editId){await updateDoc(doc(db,"events",editId),data);showToast('✅ 수정됐어요!');}
    else{await addDoc(collection(db,"events"),data);showToast('✅ 저장됐어요!');}

}

  catch(e){showToast('⚠️ 삭제 실패');}
}

// Gemini - 개선된 프롬프트
window.openGemini=function(){
  document.getElementById('imgPreviewWrap').innerHTML='<div class="img-placeholder">📷<br>아래 버튼으로<br>사진을 선택하세요</div>';
  document.getElementById('geminiStatus').textContent='사진을 선택하면 AI가 일정을 읽어드려요 🤖';
  document.getElementById('geminiStatus').style.display='block';
  document.getElementById('geminiFields').style.display='none';
  document.getElementById('btnGeminiSave').style.display='none';
  document.querySelectorAll('#gWhoSel .who-btn').forEach(b=>b.classList.remove('on'));
  gSelWho=[];openModal('geminiModal');
}
window.handleImg=function(input){
  const file=input.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=e=>{
    document.getElementById('imgPreviewWrap').innerHTML=`<img class="img-preview" src="${e.target.result}">`;
    document.getElementById('geminiStatus').innerHTML='<div class="spinner" style="margin:0 auto 6px"></div>AI가 읽는 중...';
    document.getElementById('geminiStatus').style.display='block';
    analyzeWithGemini(e.target.result);
  };
  reader.readAsDataURL(file);
}
async function analyzeWithGemini(base64){
  const b64=base64.split(',')[1],mime=base64.split(';')[0].split(':')[1];
  const prompt=`이 사진에서 일정 정보를 최대한 찾아주세요. 의료 문서, 메모, 다이어리 등 어떤 형태든 가능합니다.
반드시 아래 JSON 형식으로만 응답하고 다른 말은 절대 하지 마세요. 마크다운 코드블록도 쓰지 마세요.
{"title":"가장 중요한 일정 제목 (예: 방사선 치료, 병원 예약 등)","date":"YYYY-MM-DD (날짜가 보이면 변환, 연도 없으면 2026 사용)","time":"HH:MM (시간이 보이면 24시간 형식, 없으면 빈 문자열)","body":"날짜/시간 외 나머지 내용 요약"}
주의: 날짜가 '5월 22일'이면 2026-05-22, '10시 45분'이면 10:45 로 변환하세요.`;
  try{
    const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${GEMINI_KEY}`,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({contents:[{parts:[{inline_data:{mime_type:mime,data:b64}},{text:prompt}]}],generationConfig:{temperature:0.1}})
    });
    const data=await res.json();
    const text=data.candidates?.[0]?.content?.parts?.[0]?.text||'';
    // JSON만 추출 (어떤 형태로 와도)
    const match=text.match(/\{[\s\S]*\}/);
    if(!match) throw new Error('no json');
    const parsed=JSON.parse(match[0]);
    document.getElementById('geminiStatus').style.display='none';
    document.getElementById('geminiFields').style.display='block';
    document.getElementById('g_title').value=parsed.title||'';
    document.getElementById('g_date').value=parsed.date||'';
    document.getElementById('g_time').value=parsed.time||'';
    document.getElementById('g_body').value=parsed.body||'';
    document.getElementById('btnGeminiSave').style.display='block';
    showToast('✅ AI가 읽었어요! 확인 후 등록하세요');
  }catch(e){
    document.getElementById('geminiStatus').textContent='⚠️ 인식 실패. 직접 입력해주세요.';
    document.getElementById('geminiFields').style.display='block';
    document.getElementById('g_date').value=new Date().toISOString().slice(0,10);
    document.getElementById('btnGeminiSave').style.display='block';
  }
}
window.toggleGWho=function(btn){
  const w=btn.dataset.w;
  if(btn.classList.contains('on')){btn.classList.remove('on');gSelWho=gSelWho.filter(x=>x!==w);}
  else{btn.classList.add('on');gSelWho.push(w);}
}
window.saveGeminiEvent=async function(){
  const title=document.getElementById('g_title').value.trim();
  const date=document.getElementById('g_date').value;
  const time=document.getElementById('g_time').value;
  const body=document.getElementById('g_body').value.trim();
  if(!title){showToast('제목을 확인해주세요');return;}
  if(!date){showToast('날짜를 확인해주세요');return;}
  if(!gSelWho.length){showToast('구성원을 선택해주세요');return;}
  try{
    await addDoc(collection(db,"events"),{title,date,time,body,who:gSelWho,repeat:'none'});
    showToast('✅ 일정이 등록됐어요!');closeModal('geminiModal');
  }catch(e){showToast('⚠️ 저장 실패');}
}

// 공통
window.openAdd=function(dateStr,eid){
  editId=eid||null;selWho=[];
  document.getElementById('f_title').value='';
  document.getElementById('f_date').value=dateStr||new Date().toISOString().slice(0,10);
  document.getElementById('f_time').value='';
  document.getElementById('f_body').value='';
  document.querySelectorAll('.who-btn').forEach(b=>b.classList.remove('on'));
  document.getElementById('btnDel').style.display='none';
  document.getElementById('editModalTxt').textContent='일정 추가';
  if(eid){
    const ev=events.find(e=>e.id===eid);
    if(ev){
      document.getElementById('editModalTxt').textContent='일정 수정';
      document.getElementById('f_title').value=ev.title||'';
      document.getElementById('f_date').value=ev.date||'';
      document.getElementById('f_time').value=ev.time||'';
      document.getElementById('f_body').value=ev.body||'';
      selWho=Array.isArray(ev.who)?[...ev.who]:[ev.who];
      selWho.forEach(w=>{const b=document.querySelector(`.who-btn[data-w="${w}"]`);if(b)b.classList.add('on');});
      document.getElementById('btnDel').style.display='block';
    }
  }

}

}

}
